function doSaveItem(){
  var ei=state.ui.editItemId?itemById(state.ui.editItemId):null;
  var m=$("itMsg");
  var r=ei?updateItem(ei.id,{code:$("niCode").value,name:$("niName").value,unit:$("niUnit").value,salePrice:$("niSale").value,costPrice:$("niCost").value,qty:$("niQty").value}):createItem($("niCode").value,$("niName").value,$("niUnit").value,$("niSale").value,$("niCost").value,$("niQty").value);
  if(r.error){if(m)m.innerHTML='<div class="err">'+esc(r.error)+'</div>';return;}
  state.ui.editItemId=null;render();
  var m2=$("itMsg");if(m2)m2.innerHTML='<div class="okbox">تم حفظ الصنف «'+esc(r.item.name)+'» ('+esc(r.item.code)+').</div>';
}
function showEditItem(id){state.ui.editItemId=id;render();}
function cancelEditItem(){state.ui.editItemId=null;render();}
function delItem(id){
  var it=itemById(id);if(!it)return;
  if(typeof confirm==="function"&&!confirm("هل تريد حذف الصنف «"+it.name+"» ("+it.code+")؟"))return;
  var r=deleteItem(id);
  if(r.error){var m=$("itMsg");if(m)m.innerHTML='<div class="err">'+esc(r.error)+'</div>';else alert(r.error);return;}
  render();
}
function doImportItems(input){
  var f=input&&input.files&&input.files[0];if(!f)return;
  if(typeof FileReader==="undefined"){alert("متصفحك لا يدعم قراءة الملفات.");return;}
  var rd=new FileReader();
  rd.onload=function(){
    var r=importItemsCSV(String(rd.result||""));
    render();
    var m=$("itMsg");if(m)m.innerHTML='<div class="okbox">تم الاستيراد: مستورد '+r.imported+' — مكرر '+r.duplicated+' — مرفوض '+r.rejected+'.</div>';
  };
  rd.readAsText(f);
}
function doExportItems(){exportItemsCSV();}

   نفسه عند التعديل، أو افتراضي الدور عند الإضافة)، وتُملأ تلقائياً
   حسب الدور عند تغييره من القائمة، وتبقى قابلة للتعديل يدوياً. */
function initUserPerms(eu){
  var formKey=eu?eu.id:"new";
  if(state.ui.permUserId===formKey)return;
  state.ui.permUserId=formKey;
  state.ui.permRole=eu?eu.role:"gm";
  state.ui.permInit=eu?(Array.isArray(eu.permissions)?eu.permissions.slice():(ROLE_SCREENS[eu.role]||[]).slice()):(ROLE_SCREENS["gm"]||[]).slice();
}
function applyRolePerms(role){
  state.ui.permRole=role;
  state.ui.permInit=(ROLE_SCREENS[role]||[]).slice();
  document.querySelectorAll(".nuPerm").forEach(function(c){c.checked=state.ui.permInit.indexOf(c.value)>=0;});
}
function readPermCheckboxes(){var out=[];document.querySelectorAll(".nuPerm:checked").forEach(function(c){out.push(c.value);});return out;}

   رصيد البنك = الافتتاحي (من التهيئة) + حركات البنك المسجلة.
   رصيد الخزنة = الافتتاحي (من التهيئة) + الدفعات والإيرادات النقدية − المصروفات النقدية − تكلفة المواد. */

    '<div><label>رمز البريد</label><input id="suPostal" class="inp num" dir="ltr" value="'+esc(s.postalCode||"")+'"></div>'+
    '<div><label>الرقم الفرعي</label><input id="suSub" class="inp num" dir="ltr" value="'+esc(s.subNumber||"")+'"></div>'+

    '<div><label>العملة</label><input id="suCur" class="inp" value="'+esc(s.currency)+'"></div>'+
    '<div><label>نسبة الضريبة %</label><input id="suVat" type="number" min="0" step="0.5" class="inp" value="'+esc(s.vatRate)+'"></div>'+
    '<div><label>رصيد البنك الافتتاحي</label><input id="suBank" type="number" step="0.01" class="inp" value="'+esc(Number(s.bankBalance)||0)+'"></div>'+
    '<div><label>رصيد الخزنة الافتتاحي</label><input id="suSafe" type="number" step="0.01" class="inp" value="'+esc(Number(s.safeBalance)||0)+'"></div>'+
    '<div><label>رمز التهيئة الجديد (اتركه فارغاً للإبقاء على الحالي)</label><div class="pw-wrap"><input id="suCode" type="password" class="inp" placeholder="رمز جديد (4 أرقام على الأقل)"><button type="button" class="eye" onclick="togglePwById(\'suCode\')" title="إظهار / إخفاء الرمز">👁</button></div></div>'+

function askSetup(){state.ui.setupAsk=true;state.ui.setupOpen=false;render();}
function closeSetup(){state.ui.setupAsk=false;state.ui.setupOpen=false;render();}
function doCheckSetup(){
  var code=$("setupCodeIn")?$("setupCodeIn").value:"";
  if(checkSetupCode(code)){state.ui.setupOpen=true;render();return;}
  var e=$("setupErr");if(e)e.innerHTML='<div class="err">رمز التهيئة غير صحيح — أعد المحاولة.</div>';
}
function doSaveSetup(){
  var nc=($("suCode")?$("suCode").value:"").trim();
  var nc2=($("suCode2")?$("suCode2").value:"").trim();
  var m=$("setupMsg");
  if(nc&&nc!==nc2){if(m)m.innerHTML='<div class="err">رمز التهيئة الجديد وتأكيده غير متطابقين.</div>';return;}
  var r=saveSetupSettings({companyName:$("suName").value,companyNameEn:$("suNameEn").value,commercialReg:$("suReg").value,taxNumber:$("suTax").value,ownerName:$("suOwner").value,ownerPhone:$("suOwnerPhone").value,city:$("suCity").value,district:$("suDistrict").value,street:$("suStreet").value,buildingNo:$("suBuilding").value,postalCode:$("suPostal").value,subNumber:$("suSub").value,address:$("suAddr").value,phones:$("suPhones").value,email:$("suEmail").value,currency:$("suCur").value,vatRate:$("suVat").value,bankBalance:$("suBank").value,safeBalance:$("suSafe").value,newCode:nc||undefined});
  if(r.error){if(m)m.innerHTML='<div class="err">'+esc(r.error)+'</div>';return;}
  render();var m2=$("setupMsg");if(m2)m2.innerHTML='<div class="okbox">تم حفظ التهيئة'+(nc?" — ورمز التهيئة الجديد يعمل من الآن.":".")+'</div>';
}
function doSaveSettings(){
  var s=state.settings[0];if(!s){state.settings=[{id:"main"}];s=state.settings[0];}
  s.companyName=$("stName").value;s.currency=$("stCur").value;s.vatRate=Number($("stVat").value)||15;
  logAudit("save_settings","حفظ الإعدادات (اسم الشركة والعملة ونسبة الضريبة)","","الإعدادات");save();render();var m=$("setMsg");if(m)m.innerHTML='<div class="okbox">تم حفظ الإعدادات.</div>';
}
function backupSnapshot(){
  /* نسخة البيانات للتنزيل: سجل التدقيق لا يُشمل فيها أبداً — يبقى في
     النظام ولا يُسترجع من نسخة قديمة. */
  var snap=JSON.parse(JSON.stringify(state));
  delete snap.audit_log;
  return snap;
}
function downloadBackup(){
  try{
    var blob=new Blob([JSON.stringify(backupSnapshot())],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="MSHRY-company.json";a.click();
    setTimeout(function(){try{URL.revokeObjectURL(a.href);}catch(e){}},1000);
    logAudit("backup","تنزيل نسخة احتياطية (بدون سجل التدقيق)","","الإعدادات");save();
  }catch(e){alert("تعذّر تنزيل النسخة.");}
}
function restoreBackup(input){
  var f=input&&input.files&&input.files[0];if(!f)return;
  if(typeof confirm==="function"&&!confirm("سيتم استبدال جميع البيانات الحالية ببيانات النسخة. هل تريد المتابعة؟")){input.value="";return;}
  if(typeof FileReader==="undefined"){alert("متصفحك لا يدعم قراءة الملفات.");return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var s=JSON.parse(String(rd.result||""));
      if(!s||!s.settings){alert("ملف النسخة غير صالح.");return;}
      var keepUser=state.user;
      var keepAudit=Array.isArray(state.audit_log)?state.audit_log.slice():[];
      state=normalizeState(s);state.audit_log=keepAudit;state.user=keepUser;state.screen="dashboard";state.ui={};ensureAdminUser();
      logAudit("restore","استرجاع نسخة احتياطية — بقي سجل التدقيق كما هو ("+keepAudit.length+" سجلاً قبل الاسترجاع)","","الإعدادات");
      saveLocal();render();
      alert("تمت الاستعادة من النسخة.");
    }catch(e){alert("تعذّر قراءة ملف النسخة.");}
  };
  rd.readAsText(f);
}
/* ---------- الإقلاع ---------- */
function boot(){
  render();
  syncCheck().then(function(isServer){
    if(isServer&&SYNC.token){syncPullFromServer().then(function(){render();});}
  });
  if(typeof document!=="undefined"&&document.addEventListener){
    document.addEventListener("visibilitychange",function(){if(!document.hidden&&SYNC.mode==="server"&&SYNC.token)syncPullFromServer().then(function(){render();});});
  }
}
