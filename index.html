<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام إدارة مشاريع المقاولات</title>
<style>
:root{--navy:#0f2a4a;--navy2:#163a63;--gold:#c9a227;--gold2:#e3c766;--bg:#f2f4f7;--card:#fff;--border:#d8dee6;--text:#1c2733;--muted:#66788c;--red:#b3261e;--green:#1e7d32;--amber:#8a6d00;--r:10px}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--navy)}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:.9rem}
.num{direction:ltr;unicode-bidi:embed}
.warn{background:#fff4e0;border:1px solid #e8c26a;color:#6d5200;border-radius:8px;padding:.6rem .8rem;margin:.5rem 0;line-height:1.7}
.err{background:#fdecea;border:1px solid #e8a49f;color:var(--red);border-radius:8px;padding:.6rem .8rem;margin:.5rem 0;line-height:1.7}
.okbox{background:#e8f5e9;border:1px solid #a5d6a7;color:var(--green);border-radius:8px;padding:.6rem .8rem;margin:.5rem 0;line-height:1.7}
/* شاشة الدخول */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 60%,#0a1d33 100%)}
.login-card{background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.35);width:100%;max-width:420px;padding:2rem 1.8rem}
.login-card h1{color:var(--navy);text-align:center;margin:.2rem 0 .2rem;font-size:1.35rem}
.login-card .sub{text-align:center;color:var(--muted);margin:0 0 1.2rem}
.gold-bar{height:4px;background:var(--gold);border-radius:4px;margin:0 auto 1rem;width:90px}
label{display:block;font-weight:600;margin:.7rem 0 .25rem}
.inp{width:100%;padding:.6rem .7rem;border:1px solid var(--border);border-radius:8px;font-size:1rem;font-family:inherit}
.inp:focus{outline:2px solid var(--gold);border-color:var(--gold)}
select.inp{cursor:pointer}
textarea.inp{resize:vertical;min-height:70px}
.pw-wrap{position:relative}
.pw-wrap .inp{padding-left:2.6rem}
.eye{position:absolute;left:.4rem;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:1.15rem;color:var(--navy)}
.btn{display:inline-block;border:0;border-radius:8px;padding:.6rem 1.2rem;font-size:1rem;font-family:inherit;cursor:pointer;font-weight:700}
.btn-navy{background:var(--navy);color:#fff;width:100%}
.btn-navy:hover{background:var(--navy2)}
.btn-gold{background:var(--gold);color:#231f00}
.btn-ghost{background:#eef1f5;color:var(--navy)}
.btn-danger{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-sm{padding:.35rem .7rem;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* التطبيق */
header{background:var(--navy);color:#fff;padding:.6rem 1rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header .brand{font-weight:800;font-size:1.1rem}
header .brand span{color:var(--gold2)}
.sync-badge{font-size:.82rem;border-radius:20px;padding:.25rem .7rem;background:#33475e;color:#dbe4ee}
.sync-badge.sync-server{background:#1e7d32;color:#fff}
.sync-badge.sync-local{background:#7a5b00;color:#fff}
.sync-badge.sync-warn{background:#b3261e;color:#fff}
.user-chip{font-size:.9rem}
.user-chip button{margin-right:.5rem}
nav.tabs{background:#fff;border-bottom:2px solid var(--gold);display:flex;flex-wrap:wrap;gap:.2rem;padding:.3rem .8rem;position:sticky;top:52px;z-index:9}
nav.tabs button{border:0;background:none;padding:.55rem .8rem;font-family:inherit;font-size:.95rem;cursor:pointer;border-radius:8px;color:var(--navy);font-weight:600}
nav.tabs button.on{background:var(--navy);color:#fff}
nav.tabs button:hover{background:#eef1f5}
nav.tabs button.on:hover{background:var(--navy)}
main{max-width:1180px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem;margin-bottom:1rem}
.card h2{margin:.1rem 0 .7rem;color:var(--navy);font-size:1.15rem}
.card h3{margin:.8rem 0 .4rem;color:var(--navy);font-size:1rem}
.grid{display:grid;gap:1rem}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.stat{background:var(--navy);color:#fff;border-radius:var(--r);padding:.9rem 1rem}
.stat .n{font-size:1.7rem;font-weight:800;color:var(--gold2)}
.stat .t{font-size:.9rem;opacity:.9}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{border:1px solid var(--border);padding:.45rem .55rem;text-align:right;vertical-align:top}
th{background:var(--navy);color:#fff}
tr:nth-child(even) td{background:#f7f9fb}
.badge{display:inline-block;border-radius:12px;padding:.1rem .6rem;font-size:.82rem;font-weight:700}
.b-new{background:#e3ecf7;color:var(--navy)}
.b-assigned{background:#fff3cd;color:#6d5200}
.b-inspected{background:#d1ecf1;color:#0b5563}
.b-quoted{background:#e2e3f5;color:#3c3f8a}
.b-accepted{background:#d4edda;color:var(--green)}
.b-rejected,.b-cancelled{background:#f8d7da;color:var(--red)}
.b-approved{background:#d4edda;color:var(--green)}
.b-draft{background:#eceff1;color:#455a64}
.b-sent{background:#fff3cd;color:#6d5200}
.b-issued{background:#e8f5e9;color:var(--green)}
.b-done{background:#d4edda;color:var(--green)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.row .grow{flex:1;min-width:180px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.6rem 1rem}
.thumb{width:110px;height:90px;object-fit:cover;border:1px solid var(--border);border-radius:8px}
.media-item{display:inline-block;margin:.3rem;text-align:center;max-width:130px;vertical-align:top}
.linklike{background:none;border:0;color:var(--navy);cursor:pointer;font-weight:700;text-decoration:underline;font-family:inherit;font-size:inherit;padding:0}
.notif{border:1px solid var(--border);border-right:4px solid var(--gold);border-radius:8px;padding:.6rem .8rem;margin-bottom:.5rem;background:#fff}
.notif.unread{background:#fffbe6}
.notif .time{color:var(--muted);font-size:.82rem}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1rem}
@media (max-width:640px){main{padding:.6rem}nav.tabs{top:96px}.stat .n{font-size:1.4rem}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================
   نظام إدارة مشاريع المقاولات — واجهة موقع (ملف واحد)
   قاعدة شركة واحدة: MSHRY_company (+ نسخة احتياطية واحدة
   MSHRY_backup_company). تبدأ فارغة تماماً بلا بيانات تجريبية.
   المزامنة: نفس عقد المزامنة المعتمد — GET /api/health (مهلة 3 ثوانٍ)،
   وضع الخادم يفعّل فقط عند mode='postgres'.
   *** فصل تام عن النظام السابق على المشروع نفسه: مفاتيح التخزين
   المحلي هنا MSHRY_* و companyId هنا "mshry-default" — لا يقرأ
   هذا الملف ولا يكتب أي مفتاح يخص النظام السابق، ولا يشير إلى
   أي جدول خاص بنظام آخر. ***
   ============================================================ */
var COMPANY_KEY="MSHRY_company";
var COMPANY_ID="mshry-default";
var BKKEY="MSHRY_backup_company";
var BKMETA="MSHRY_backup_meta_company";
var ADMIN_USER="1";
var COLLECTIONS=["users","clients","projects","assignments","media","quotations","approvals","contracts","material_issues","payments","notifications","settings","counters"];
var PROJECT_TYPES=["تركيب كاميرات","صيانة","توريد أدوات سلامة","مضخات","أخرى"];
var CONTRACT_TYPES=["صيانة","كاميرات","نظافة","مكافحة حشرات"];
var ROLES={
  gm:{name:"المدير العام",label:"مدير عام"},
  projects_manager:{name:"مدير المشاريع",label:"مدير مشاريع"},
  technician:{name:"فني",label:"فني"},
  accounts:{name:"الحسابات",label:"حسابات"},
  storekeeper:{name:"أمين مخزن",label:"أمين مخزن"},
  hr:{name:"الموارد البشرية",label:"موارد بشرية"},
  secretariat:{name:"السكرتارية",label:"سكرتارية"}
};
/* الصلاحيات: ما الذي يراه كل دور */
var ROLE_SCREENS={
  gm:["dashboard","projects","tasks","quotations","approvals","materials","contracts","financial","reports","users","employees","notifications","settings"],
  projects_manager:["dashboard","projects","tasks","quotations","approvals","notifications"],
  technician:["tasks","notifications"],
  accounts:["dashboard","materials","financial","reports","notifications"],
  storekeeper:["materials","notifications"],
  hr:["employees","notifications"],
  secretariat:["contracts","notifications"]
};
var SCREEN_TITLES={
  dashboard:"لوحة المتابعة",projects:"إدارة المشاريع",tasks:"مهامي",
  quotations:"عروض الأسعار",approvals:"التعميد (المدير العام)",
  materials:"صرف المواد",contracts:"العقود",financial:"الاعتماد المالي والمديونيات",
  reports:"التقارير — ميزان المراجعة",users:"المستخدمون",employees:"الموظفون والإجازات",
  notifications:"الإشعارات",settings:"الإعدادات"
};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function nowISO(){return new Date().toISOString();}
function fmtM(n){n=Number(n)||0;return n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtDate(s){return s?String(s).slice(0,10):"—";}
function uid(p){return (p||"id")+"-"+Date.now().toString(36)+"-"+Math.floor(Math.random()*1e6).toString(36);}
function roleName(r){return ROLES[r]?ROLES[r].name:r;}
function projectStatusLabel(s){return {"new":"جديد","assigned":"مُسند للفنيين","inspected":"تمت المعاينة","inspection_rejected":"معاينة مرفوضة","quoted":"عرض سعر","client_accepted":"قبل العميل","client_rejected":"رفض العميل","gm_approved":"معمّد","gm_rejected":"رفض التعميد","contracted":"العقد جاهز","issued":"المواد منصرفة","approved":"معتمد مالياً","completed":"مكتمل"}[s]||s;}
function quoteStatusLabel(s){return {"draft":"مسودة","sent":"مُرسل للعميل","client_accepted":"قبل العميل","client_rejected":"رفض العميل","cancelled":"ملغي","gm_approved":"معمّد","gm_rejected":"رفض التعميد","financial_approved":"معتمد مالياً"}[s]||s;}
function statusBadge(s,kind){var cls="b-draft";if(kind==="project"){cls={"new":"b-new","assigned":"b-assigned","inspected":"b-inspected","inspection_rejected":"b-rejected","quoted":"b-quoted","client_accepted":"b-accepted","client_rejected":"b-cancelled","gm_approved":"b-approved","gm_rejected":"b-rejected","contracted":"b-quoted","issued":"b-issued","approved":"b-approved","completed":"b-done"}[s]||"b-draft";}
else{cls={"draft":"b-draft","sent":"b-sent","client_accepted":"b-accepted","client_rejected":"b-cancelled","cancelled":"b-cancelled","gm_approved":"b-approved","gm_rejected":"b-rejected","financial_approved":"b-approved"}[s]||"b-draft";}
return '<span class="badge '+cls+'">'+esc(kind==="project"?projectStatusLabel(s):quoteStatusLabel(s))+'</span>';}
</script>
<script>
/* ---------- الحالة والتخزين المحلي ---------- */
function defState(){return {
  users:[],clients:[],projects:[],assignments:[],media:[],quotations:[],
  approvals:[],contracts:[],material_issues:[],payments:[],notifications:[],
  settings:[{id:"main",companyName:"شركة المقاولات",currency:"ر.س",vatRate:15}],
  counters:[{id:"main",project:0,quotation:0,contract:0,payment:0,client:0}],
  employees:[],leaves:[]
};}
function loadState(){
  var raw=null;
  try{raw=localStorage.getItem(COMPANY_KEY);}catch(e){}
  if(raw){try{var s=JSON.parse(raw);if(s&&s.settings){return normalizeState(s);}}catch(e){}}
  try{var bk=localStorage.getItem(BKKEY);if(bk){var s2=JSON.parse(bk);if(s2&&s2.settings){try{localStorage.setItem(COMPANY_KEY,bk);}catch(e){}return normalizeState(s2);}}}catch(e){}
  return defState();
}
function normalizeState(s){
  var d=defState();
  COLLECTIONS.forEach(function(c){if(Array.isArray(s[c]))d[c]=s[c];});
  if(Array.isArray(s.employees))d.employees=s.employees;
  if(Array.isArray(s.leaves))d.leaves=s.leaves;
  return d;
}
var state=loadState();
state.user=null;state.screen="dashboard";state.ui={};
function defaultAdminUser(){return {id:"u-1",username:"1",password:"1",fullName:"المدير العام",role:"gm",companyId:COMPANY_ID,active:true,createdAt:nowISO()};}
function ensureAdminUser(){
  if(!Array.isArray(state.users))state.users=[];
  var found=null;
  for(var i=0;i<state.users.length;i++){if(state.users[i]&&state.users[i].username==="1"){found=state.users[i];break;}}
  if(!found){found=defaultAdminUser();state.users.unshift(found);}
  return found;
}
/* يُزرع المدير 1/1 فقط عند غياب حساب "1" تماماً. إن وُجد — حتى بعد تغيير
   كلمة مروره أو إيقافه — لا يُمسّ إطلاقاً. */
ensureAdminUser();
function saveLocal(){try{var j=JSON.stringify(state);localStorage.setItem(COMPANY_KEY,j);localStorage.setItem(BKKEY,j);localStorage.setItem(BKMETA,new Date().toISOString());}catch(e){}}
function save(){saveLocal();scheduleSyncPush();}
function counters(){if(!state.counters||!state.counters.length)state.counters=[{id:"main",project:0,quotation:0,contract:0,payment:0,client:0}];return state.counters[0];}
function nextSerial(kind,prefix){
  var c=counters();c[kind]=(Number(c[kind])||0)+1;
  var n=prefix+"-"+String(c[kind]).padStart(4,"0");
  while(isSerialUsed(kind,n)){c[kind]++;n=prefix+"-"+String(c[kind]).padStart(4,"0");}
  return n;
}
function isSerialUsed(kind,num){
  var list=kind==="project"?state.projects:kind==="quotation"?state.quotations:state.contracts;
  var field=kind==="project"?"number":kind==="quotation"?"number":"number";
  for(var i=0;i<list.length;i++){if(String(list[i][field])===String(num))return true;}
  return false;
}
function peekSerial(kind,prefix){var c=counters();return prefix+"-"+String((Number(c[kind])||0)+1).padStart(4,"0");}

/* ---------- المزامنة مع قاعدة الخادم (العقد المعتمد نفسه) ---------- */
var SYNC={mode:"local",token:null,companyId:null,busy:false,lastSync:null,checked:false,serverMode:null,serverHealthy:true,pushFailed:0};
var SYNC_COLLECTIONS=[["users","users"],["clients","clients"],["projects","projects"],["assignments","assignments"],["media","media"],["quotations","quotations"],["approvals","approvals"],["contracts","contracts"],["material_issues","material_issues"],["payments","payments"],["notifications","notifications"],["settings","settings"],["counters","counters"]];
var SYNC_PUSH_TIMER=null;
function syncHeaders(){var h={"Content-Type":"application/json"};if(SYNC.token)h["Authorization"]="Bearer "+SYNC.token;return h;}
function syncSetBadge(){
  var b=$("syncBadge");if(!b)return;
  if(SYNC.mode==="server"&&SYNC.serverHealthy&&SYNC.pushFailed===0){b.className="sync-badge sync-server";b.textContent="متصل بالخادم — بيانات الشركة مشتركة";}
  else if(SYNC.mode==="server"&&SYNC.pushFailed>0){b.className="sync-badge sync-warn";b.textContent="تحذير: تعذّر حفظ آخر "+SYNC.pushFailed+" عملية على الخادم — البيانات محفوظة على هذا الجهاز وستُعاد المحاولة";}
  else if(SYNC.mode==="server"){b.className="sync-badge sync-server";b.textContent="الخادم متصل لكن الحفظ عليه تعذّر — البيانات محفوظة على هذا الجهاز فقط";}
  else if(SYNC.serverMode==="local-json"){b.className="sync-badge sync-local";b.textContent="قاعدة الخادم غير متصلة بعد، البيانات على هذا الجهاز فقط";}
  else{b.className="sync-badge sync-local";b.textContent="وضع محلي — البيانات على هذا الجهاز فقط";}
}
function syncNote(){
  var n=$("loginModeNote");if(!n)return;
  if(SYNC.mode==="server"){n.textContent="متصل بالخادم: بيانات الشركة محفوظة مركزياً في قاعدة البيانات الواحدة المشتركة، وتظهر على جميع الأجهزة بعد الدخول بنفس الحساب. إنشاء المستخدمين يكون من داخل النظام عبر شاشة المستخدمين وبواسطة المدير العام فقط.";}
  else if(SYNC.serverMode==="local-json"){n.textContent="تنبيه: قاعدة بيانات الخادم المشتركة غير متصلة بعد — الخادم يعمل بوضع التخزين المحلي المؤقت الذي لا يحفظ بين الطلبات، فالبيانات محفوظة على هذا الجهاز فقط الآن ولن تظهر على جهاز آخر. إنشاء المستخدمين يكون من داخل النظام عبر شاشة المستخدمين وبواسطة المدير العام فقط.";}
  else{n.textContent="إنشاء المستخدمين يكون من داخل النظام عبر شاشة المستخدمين وبواسطة المدير العام فقط — لا يوجد تسجيل من شاشة الدخول.";}
}
function syncCheck(){
  if(typeof fetch!=="function"){SYNC.checked=true;syncSetBadge();return Promise.resolve(false);}
  if(typeof location!=="undefined"&&location.protocol==="file:"){SYNC.checked=true;syncSetBadge();return Promise.resolve(false);}
  var ctl=null;try{ctl=new AbortController();}catch(e){ctl=null;}
  var to=null;if(ctl)to=setTimeout(function(){try{ctl.abort();}catch(e){}},3000);
  return fetch("/api/health",{cache:"no-store",signal:ctl?ctl.signal:undefined}).then(function(r){
    if(to)clearTimeout(to);if(!r.ok)throw new Error("health "+r.status);return r.json();
  }).then(function(j){
    if(j&&j.ok){SYNC.serverMode=j.mode||null;if(j.mode==="postgres"){SYNC.mode="server";SYNC.serverHealthy=true;}else{SYNC.mode="local";}}
    SYNC.checked=true;syncSetBadge();syncNote();return SYNC.mode==="server";
  }).catch(function(){
    if(to)clearTimeout(to);SYNC.mode="local";SYNC.serverMode=null;SYNC.checked=true;syncSetBadge();syncNote();return false;
  });
}
function syncNormRows(rows){
  if(!Array.isArray(rows))return [];
  return rows.map(function(row){
    if(row&&typeof row==="object"&&row.data&&typeof row.data==="object"){
      var d={};for(var k in row.data)if(Object.prototype.hasOwnProperty.call(row.data,k))d[k]=row.data[k];
      if(row.id!==undefined&&d.id===undefined)d.id=row.id;return d;
    }return row;
  });
}
function apiGet(coll){return fetch("/api/data?collection="+encodeURIComponent(coll),{headers:syncHeaders(),cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("get "+coll+" "+r.status);return r.json();}).then(function(j){if(Array.isArray(j))return syncNormRows(j);if(j&&Array.isArray(j.records))return syncNormRows(j.records);if(j&&Array.isArray(j.data))return syncNormRows(j.data);return [];});}
function apiPost(coll,id,data){return fetch("/api/data",{method:"POST",headers:syncHeaders(),body:JSON.stringify({collection:coll,id:id,companyId:COMPANY_ID,data:data})}).then(function(r){if(!r.ok)throw new Error("post "+coll+" "+r.status);return r.json().catch(function(){return {};});});}
function apiDel(coll,id){return fetch("/api/data?collection="+encodeURIComponent(coll)+"&id="+encodeURIComponent(id),{method:"DELETE",headers:syncHeaders()}).then(function(r){if(!r.ok)throw new Error("del "+coll+" "+r.status);return r.json().catch(function(){return {};});});}
/* دمج آمن: اتحاد صفوف الخادم والمحلية حسب المعرّف (الخادم يفوز عند التعارض
   بالأحدث updatedAt، وبلا طابع زمني يفوز الخادم)، ولا يُمحى أي صف محلي
   أبداً لأن الخادم أعاد قائمة فارغة. */
function syncMergeRows(localRows,serverRows){
  var out=[];var seen={};
  function key(r){return (r&&r.id!==undefined&&r.id!==null)?String(r.id):null;}
  function upd(r){return (r&&r.updatedAt)?String(r.updatedAt):"";}
  (serverRows||[]).forEach(function(row){if(!row)return;out.push(row);var k=key(row);if(k!==null)seen[k]=row;});
  (localRows||[]).forEach(function(row){
    if(!row)return;var k=key(row);
    if(k===null||!seen[k]){out.push(row);return;}
    var srv=seen[k];
    if(upd(row)>upd(srv)){var ix=out.indexOf(srv);if(ix>=0)out[ix]=row;}
  });
  return out;
}
function syncPullFromServer(){
  if(SYNC.mode!=="server"||!SYNC.token)return Promise.resolve(false);
  SYNC.busy=true;
  var jobs=SYNC_COLLECTIONS.map(function(pair){
    return apiGet(pair[0]).then(function(rows){return {key:pair[1],rows:rows};}).catch(function(){return {key:pair[1],rows:null};});
  });
  return Promise.all(jobs).then(function(results){
    var changed=false;var serverEmptyEverywhere=true;var localHasData=false;
    results.forEach(function(res){
      if(!res||res.rows===null)return;
      if(res.rows.length)serverEmptyEverywhere=false;
      var local=state[res.key]||[];
      if(local.length)localHasData=true;
      var merged=syncMergeRows(local,res.rows);
      if(JSON.stringify(merged)!==JSON.stringify(local)){state[res.key]=merged;changed=true;}
    });
    ensureAdminUser();
    if(changed)saveLocal();
    SYNC.lastSync=new Date().toISOString();SYNC.busy=false;syncSetBadge();
    /* إن كان الخادم فارغاً تماماً والمحلي فيه بيانات: تُدفع البيانات المحلية إلى الخادم */
    if(serverEmptyEverywhere&&localHasData){return syncPushNow().then(function(){return true;});}
    return changed;
  }).catch(function(){SYNC.busy=false;return false;});
}
function scheduleSyncPush(){
  if(SYNC.mode!=="server"||!SYNC.token)return;
  if(SYNC_PUSH_TIMER)return;
  SYNC_PUSH_TIMER=setTimeout(function(){SYNC_PUSH_TIMER=null;syncPushNow();},800);
}
/* الدفع يعدّ الفشل ولا يبتلعه بصمت: إن فشل أي حفظ على الخادم تُعرض شارة
   تحذير وتبقى البيانات محفوظة محلياً، وتُعاد المحاولة عند الحفظ التالي. */
function syncPushNow(){
  if(SYNC.mode!=="server"||!SYNC.token||SYNC.busy)return Promise.resolve(false);
  SYNC.busy=true;var jobs=[];
  SYNC_COLLECTIONS.forEach(function(pair){
    var rows=state[pair[1]]||[];
    rows.forEach(function(row){
      if(!row||row.id===undefined)return;
      jobs.push(apiPost(pair[0],String(row.id),row).then(function(){return true;}).catch(function(){return false;}));
    });
  });
  return Promise.all(jobs).then(function(res){
    var failed=0;res.forEach(function(ok){if(!ok)failed++;});
    SYNC.pushFailed=failed;SYNC.busy=false;
    if(failed===0)SYNC.lastSync=new Date().toISOString();
    else SYNC.serverHealthy=false;
    syncSetBadge();return failed===0;
  }).catch(function(){SYNC.pushFailed=1;SYNC.busy=false;syncSetBadge();return false;});
}
function syncRefresh(){
  var s=$("syncStatus");if(s)s.textContent="جارٍ التحديث من الخادم…";
  syncPullFromServer().then(function(ok){
    if(s)s.textContent=ok?"تم التحديث من الخادم.":"تعذّر التحديث من الخادم — البيانات المعروضة هي المحلية.";
    render();
  });
}

/* ---------- الدخول ---------- */
function serverLogin(un,pw){
  /* يُرسل companyId الخاص بهذا النظام ("mshry-default") مع طلب الدخول
     حتى تعزل الواجهة الخلفية مستخدميه وبياناته عن أي نظام آخر على
     المشروع نفسه؛ وسجلات المستخدمين نفسها تحمل companyId أيضاً. */
  return fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:un,password:pw,companyId:COMPANY_ID})}).then(function(r){
    if(!r.ok)throw new Error("auth "+r.status);return r.json();
  }).then(function(j){
    if(!j||!j.token||!j.user)throw new Error("bad auth");
    SYNC.token=j.token;SYNC.companyId=j.companyId||null;
    try{sessionStorage.setItem("MSHRY_sync_token",j.token);}catch(e){}
    return j.user;
  });
}
function findLocalUser(un){
  for(var i=0;i<state.users.length;i++){if(state.users[i]&&String(state.users[i].username)===String(un))return state.users[i];}
  return null;
}
/* دخول احتياطي محلي: عند فشل دخول الخادم يُقبل مستخدم موجود محلياً
   بنفس كلمة المرور المخزنة محلياً. */
function localLogin(un,pw){
  var u=findLocalUser(un);
  if(!u)return null;
  if(u.active===false)return {error:"هذا الحساب موقوف — راجع المدير العام."};
  if(String(u.password)!==String(pw))return null;
  return {username:u.username,fullName:u.fullName||u.username,role:u.role};
}
function doLogin(){
  var un=($("loginUser")?$("loginUser").value:"").trim();
  var pw=$("loginPass")?$("loginPass").value:"";
  var err=$("loginErr");
  function fail(msg){if(err){err.textContent=msg;err.classList.remove("hidden");}}
  if(!un||!pw){fail("أدخل اسم المستخدم وكلمة المرور.");return Promise.resolve(false);}
  function finish(userObj){
    var u=findLocalUser(userObj.username);
    if(!u){fail("بيانات الدخول غير صحيحة.");return false;}
    if(u.active===false){fail("هذا الحساب موقوف — راجع المدير العام.");return false;}
    state.user={id:u.id,username:u.username,fullName:u.fullName||u.username,role:u.role};
    state.screen=(u.role==="technician")?"tasks":(u.role==="hr"?"employees":(u.role==="storekeeper"?"materials":(u.role==="secretariat"?"contracts":"dashboard")));
    if(err)err.classList.add("hidden");
    saveLocal();
    if(SYNC.mode==="server")syncPullFromServer().then(function(){render();});
    render();
    return true;
  }
  if(SYNC.mode==="server"){
    return serverLogin(un,pw).then(function(userObj){return finish(userObj);}).catch(function(){
      var local=localLogin(un,pw);
      if(local&&!local.error)return finish(local);
      if(local&&local.error){fail(local.error);return false;}
      fail("بيانات الدخول غير صحيحة.");return false;
    });
  }
  var local2=localLogin(un,pw);
  if(local2&&!local2.error)return Promise.resolve(finish(local2));
  if(local2&&local2.error){fail(local2.error);return Promise.resolve(false);}
  fail("بيانات الدخول غير صحيحة.");return Promise.resolve(false);
}

function assignTechnicians(projectId,technicianIds){

function pmDecision(projectId,decision,reason){
  var p=projectById(projectId);if(!p)return {error:"المشروع غير موجود."};

  reason=String(reason||"").trim();

  return {project:p};
}
function quoteTotals(items,maintenanceAmount){
  var sub=0;(items||[]).forEach(function(it){sub+=(Number(it.qty)||0)*(Number(it.price)||0);});
  var maint=Number(maintenanceAmount)||0;
  var base=sub+maint;
  var vat=Math.round(base*0.15*100)/100;
  return {subtotal:sub,maintenance:maint,vat:vat,total:Math.round((base+vat)*100)/100};
}
function createQuotation(projectId,items,maintenance,number){
  var p=projectById(projectId);if(!p)return {error:"المشروع غير موجود."};
  items=(items||[]).filter(function(it){return String(it.name||"").trim()&&Number(it.qty)>0;});
  if(!items.length)return {error:"أضف بنداً واحداً على الأقل (صنف وكمية وسعر)."};
  number=String(number||"").trim()||nextSerial("quotation","Q");
  if(isSerialUsed("quotation",number))return {error:"رقم العرض «"+number+"» مستخدم من قبل — أدخل رقماً آخر."};
  var maint={included:!!(maintenance&&maintenance.included),type:String((maintenance&&maintenance.type)||"").trim(),amount:Number((maintenance&&maintenance.amount)||0)||0,duration:String((maintenance&&maintenance.duration)||"").trim()};
  var t=quoteTotals(items,maint.included?maint.amount:0);
  var q={id:uid("qt"),number:number,projectId:p.id,clientId:p.clientId,items:items.map(function(it){return {name:String(it.name).trim(),qty:Number(it.qty),price:Number(it.price)};}),maintenance:maint,subtotal:t.subtotal,vat:t.vat,total:t.total,status:"draft",createdAt:nowISO(),updatedAt:nowISO()};
  state.quotations.push(q);
  p.status="quoted";p.updatedAt=nowISO();save();return {quotation:q};
}

function clientResponse(quotationId,decision,note){

    return {quotation:q};

  q.status="cancelled";q.clientResponseNote=String(note||"").trim();q.updatedAt=nowISO();
  if(p){p.status="client_rejected";p.updatedAt=nowISO();}

function gmApprove(quotationId){

function issueMaterial(issueId,qty){
  var mi=null;for(var i=0;i<state.material_issues.length;i++)if(String(state.material_issues[i].id)===String(issueId))mi=state.material_issues[i];
  if(!mi)return {error:"بند الصرف غير موجود."};
  qty=Number(qty)||0;
  if(qty<=0)return {error:"أدخل كمية منصرفة أكبر من صفر."};
  var remaining=mi.qtyOrdered-mi.qtyIssued;
  if(qty>remaining)return {error:"الكمية المطلوبة ("+qty+") أكبر من المتبقي ("+remaining+") لهذا البند."};
  mi.qtyIssued+=qty;mi.issuedBy=state.user?state.user.username:"—";mi.date=today();mi.updatedAt=nowISO();save();return {issue:mi};

function allMaterialsIssued(quotationId){

function financialApprove(quotationId){

}
function setOpeningBalance(clientId,amount){
  var cl=clientById(clientId);if(!cl)return {error:"العميل غير موجود."};
  cl.openingBalance=Number(amount)||0;cl.updatedAt=nowISO();save();return {client:cl};
}
/* ميزان مراجعة بحسابات العملاء: افتتاحي + مدين (مديونيات معتمدة) + دائن
   (دفعات) + ختامي لكل عميل، مع صف إجمالي كلي. */
function trialBalance(){
  var rows=state.clients.map(function(cl){
    var debit=0;state.quotations.forEach(function(q){if(String(q.clientId)===String(cl.id)&&q.status==="financial_approved")debit+=Number(q.total)||0;});
    var credit=0;state.payments.forEach(function(p){if(String(p.clientId)===String(cl.id))credit+=Number(p.amount)||0;});
    var opening=Number(cl.openingBalance)||0;
    return {client:cl,opening:opening,debit:debit,credit:credit,closing:opening+debit-credit};
  });
  var tot={opening:0,debit:0,credit:0,closing:0};
  rows.forEach(function(r){tot.opening+=r.opening;tot.debit+=r.debit;tot.credit+=r.credit;tot.closing+=r.closing;});
  return {rows:rows,total:tot};
}
function clientStatement(clientId){
  var cl=clientById(clientId);if(!cl)return null;
  var moves=[{date:cl.createdAt?String(cl.createdAt).slice(0,10):today(),doc:"رصيد افتتاحي",desc:"رصيد افتتاحي",debit:Number(cl.openingBalance)||0,credit:0}];
  state.quotations.forEach(function(q){
    if(String(q.clientId)===String(clientId)&&q.status==="financial_approved")
      moves.push({date:String(q.financialApprovedAt||q.updatedAt||"").slice(0,10),doc:q.number,desc:"مديونية — عرض سعر "+q.number, debit:Number(q.total)||0,credit:0});
  });
  state.payments.forEach(function(p){
    if(String(p.clientId)===String(clientId))
      moves.push({date:p.date,doc:p.docNo,desc:(p.kind==="advance"?"دفعة مقدمة":"دفعة سداد")+(p.note?" — "+p.note:""),debit:0,credit:Number(p.amount)||0});
  });
  moves.sort(function(a,b){return String(a.date).localeCompare(String(b.date));});
  var bal=0;moves.forEach(function(m){bal+=m.debit-m.credit;m.balance=bal;});
  return {client:cl,moves:moves,finalBalance:bal};
}
/* حماية الحذف: لا يُحذف مستند تم العمل عليه */
function projectHasWork(projectId){
  return state.assignments.some(function(a){return String(a.projectId)===String(projectId);})||
    state.media.some(function(m){return String(m.projectId)===String(projectId);})||
    state.quotations.some(function(q){return String(q.projectId)===String(projectId);});
}
function deleteProject(projectId){
  var p=projectById(projectId);if(!p)return {error:"المشروع غير موجود."};
  if(projectHasWork(projectId))return {error:"لا يمكن حذف المشروع "+p.number+" — تم العمل عليه (إسناد أو معاينة أو عرض سعر)."};
  state.projects=state.projects.filter(function(x){return String(x.id)!==String(projectId);});
  save();return {ok:true};
}
function createUser(username,password,fullName,role){
  username=String(username||"").trim();password=String(password||"");
  if(!username||!password)return {error:"اسم المستخدم وكلمة المرور مطلوبان."};
  if(!ROLES[role])return {error:"اختر دوراً صحيحاً."};
  if(findLocalUser(username))return {error:"اسم المستخدم «"+username+"» موجود من قبل."};
  var u={id:uid("u"),username:username,password:password,fullName:String(fullName||"").trim()||username,role:role,companyId:COMPANY_ID,active:true,createdAt:nowISO()};
  state.users.push(u);save();return {user:u};
}
function updateUser(userId,fields){
  var u=userById(userId);if(!u)return {error:"المستخدم غير موجود."};
  if(fields.username&&String(fields.username).trim()!==u.username&&findLocalUser(fields.username))return {error:"اسم المستخدم الجديد موجود من قبل."};
  if(fields.username)u.username=String(fields.username).trim();
  if(fields.fullName!==undefined)u.fullName=String(fields.fullName).trim();
  if(fields.role&&ROLES[fields.role])u.role=fields.role;
  if(fields.password)u.password=String(fields.password);
  if(fields.active!==undefined)u.active=!!fields.active;
  save();return {user:u};
}
function deleteUser(userId){
  var u=userById(userId);if(!u)return {error:"المستخدم غير موجود."};
  if(u.username==="1")return {error:"لا يمكن حذف المدير العام."};
  if(state.assignments.some(function(a){return String(a.technicianId)===String(userId);}))return {error:"لا يمكن حذف هذا المستخدم — لديه مهام مسندة."};
  state.users=state.users.filter(function(x){return String(x.id)!==String(userId);});
  save();return {ok:true};
}

function handleMediaFile(pid,input,kind){
  var f=input&&input.files&&input.files[0];if(!f)return;
  var noteEl=$("mediaNote-"+pid);var note=noteEl?noteEl.value:"";
  if(kind==="video"){
    var r=addMedia(pid,"video",f.name,f.size,null,note);
    if(r.error){alert(r.error);return;}
    render();var m=$("taskMsg");if(m)m.innerHTML='<div class="okbox">سُجّل الفيديو «'+esc(f.name)+'» بالاسم والحجم ('+Math.round(f.size/1024)+' KB) مع الملاحظة — الفيديو نفسه غير محفوظ داخل ملف البيانات.</div>';
    return;
  }
  if(f.size>3*1024*1024){alert("الصورة أكبر من 3 ميغابايت — صغّرها قبل الرفع حتى تُحفظ داخل النظام.");input.value="";return;}
  if(typeof FileReader==="undefined"){alert("متصفحك لا يدعم قراءة الملفات.");return;}
  var rd=new FileReader();
  rd.onload=function(){
    var r2=addMedia(pid,"photo",f.name,f.size,String(rd.result||""),note);
    if(r2.error){alert(r2.error);return;}
    render();
  };

/* ---------- الاعتماد المالي والمديونيات ---------- */
function screenFinancial(){
  var h='<div class="card"><h2>الاعتماد المالي والمديونيات</h2><p class="muted">لا يُعتمد العرض ولا تُسجَّل المديونية إلا بعد تأشير اكتمال صرف كل المواد — إن حاولت الاعتماد قبلها ستظهر رسالة واضحة بالبنود المتبقية.</p><div id="finMsg"></div>';
  var qs=state.quotations.filter(function(q){return q.status==="gm_approved"||q.status==="financial_approved";});
  if(!qs.length)h+='<p class="muted">لا توجد عروض معمّدة بانتظار الاعتماد المالي.</p>';
  qs.forEach(function(q){
    var done=allMaterialsIssued(q.id);
    h+='<div class="card" style="border:1px solid var(--gold)"><h3>عرض '+esc(q.number)+' — '+(projectById(q.projectId)?esc(projectById(q.projectId).clientName):"")+' — الإجمالي: <b class="num">'+fmtM(q.total)+'</b></h3>'+
    '<p>صرف المواد: '+(done?'<span class="badge b-approved">مكتمل ✓</span>':'<span class="badge b-sent">غير مكتمل — راجع شاشة صرف المواد</span>')+'</p>'+
    (q.status==="gm_approved"?'<button type="button" class="btn btn-green" onclick="doFinApprove(\''+q.id+'\')">اعتماد العرض وتسجيل المديونية على العميل</button>':'<p><span class="badge b-approved">معتمد مالياً ✓</span> — سُجلت المديونية بتاريخ '+fmtDate(q.financialApprovedAt)+' بواسطة '+esc(q.financialApprovedBy||"—")+'</p>')+
    '</div>';
  });
  h+='</div><div class="card"><h2>تسجيل دفعة (مقدمة / سداد)</h2><div class="form-grid">'+
  '<div><label>العميل *</label><select id="payClient" class="inp">'+clientOptions()+'</select></div>'+
  '<div><label>نوع الدفعة</label><select id="payKind" class="inp"><option value="advance">دفعة مقدمة</option><option value="payment">دفعة سداد</option></select></div>'+
  '<div><label>المبلغ *</label><input id="payAmt" type="number" min="0" step="0.01" class="inp"></div>'+
  '<div><label>ملاحظة</label><input id="payNote" class="inp" placeholder="اختياري"></div></div>'+
  '<div class="row" style="margin-top:.6rem"><button type="button" class="btn btn-navy" onclick="doPay()">تسجيل الدفعة وخصمها من المديونية</button></div></div>';
  h+='<div class="card"><h2>الدفعات المسجلة</h2>';
  if(!state.payments.length)h+='<p class="muted">لا توجد دفعات بعد.</p>';
  else{
    h+='<table><tr><th>رقم المستند</th><th>العميل</th><th>النوع</th><th>المبلغ</th><th>التاريخ</th><th>ملاحظة</th></tr>';
    state.payments.slice().reverse().forEach(function(p){
      h+='<tr><td class="num">'+esc(p.docNo)+'</td><td>'+esc((clientById(p.clientId)||{}).name||"")+'</td><td>'+(p.kind==="advance"?"دفعة مقدمة":"دفعة سداد")+'</td><td class="num">'+fmtM(p.amount)+'</td><td class="num">'+esc(p.date)+'</td><td>'+esc(p.note||"")+'</td></tr>';
    });
    h+='</table>';
  }
  return h+'</div>';
}
function doFinApprove(qid){
  var r=financialApprove(qid);
  var m=$("finMsg");
  if(r.error){if(m)m.innerHTML='<div class="err">'+esc(r.error)+'</div>';else alert(r.error);return;}
  render();var m2=$("finMsg");if(m2)m2.innerHTML='<div class="okbox">تم الاعتماد المالي للعرض '+esc(r.quotation.number)+' وسُجلت المديونية على العميل.</div>';
}
function doPay(){
  var r=recordPayment($("payClient").value,$("payKind").value,$("payAmt").value,$("payNote").value);
  if(r.error){alert(r.error);return;}
  render();var m=$("finMsg");if(m)m.innerHTML='<div class="okbox">تم تسجيل الدفعة '+esc(r.payment.docNo)+' بمبلغ '+fmtM(r.payment.amount)+'.</div>';
}
/* ---------- التقارير: ميزان المراجعة + كشف الحساب التحليلي ---------- */
function screenReports(){
  if(state.ui.statementClientId){
    var st=clientStatement(state.ui.statementClientId);
    if(!st){state.ui.statementClientId=null;return screenReports();}
    var h='<div class="card"><h2>كشف حساب العميل التحليلي — '+esc(st.client.name)+'</h2>'+
    '<button type="button" class="btn btn-ghost btn-sm" onclick="backToTrial()">← عودة لميزان المراجعة</button>'+
    '<table style="margin-top:.7rem"><tr><th>التاريخ</th><th>رقم المستند</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد الجاري</th></tr>';
    st.moves.forEach(function(m){
      h+='<tr><td class="num">'+esc(m.date)+'</td><td class="num">'+esc(m.doc)+'</td><td>'+esc(m.desc)+'</td><td class="num">'+(m.debit?fmtM(m.debit):"—")+'</td><td class="num">'+(m.credit?fmtM(m.credit):"—")+'</td><td class="num"><b>'+fmtM(m.balance)+'</b></td></tr>';
    });
    h+='</table><p><b>الرصيد النهائي: <span class="num">'+fmtM(st.finalBalance)+'</span></b></p></div>';
    return h;
  }
  var tb=trialBalance();
  var h='<div class="card"><h2>ميزان مراجعة بحسابات العملاء</h2><p class="muted">اضغط على اسم العميل لفتح كشف حسابه التحليلي بكل الحركات بتواريخها وأرقام مستنداتها والأرصدة الجارية. الرصيد الافتتاحي قابل للتعديل من الحسابات.</p><div id="tbMsg"></div>'+
  '<table><tr><th>العميل</th><th>رصيد افتتاحي</th><th>مدين (مديونيات معتمدة)</th><th>دائن (دفعات)</th><th>رصيد ختامي</th></tr>';
  tb.rows.forEach(function(r){
    h+='<tr><td><button type="button" class="linklike" onclick="openStatement(\''+r.client.id+'\')">'+esc(r.client.name)+'</button></td>'+
    '<td class="num">'+fmtM(r.opening)+(isAccounts()?' <button type="button" class="btn btn-ghost btn-sm" onclick="editOpening(\''+r.client.id+'\')">تعديل</button>':"")+'</td>'+
    '<td class="num">'+fmtM(r.debit)+'</td><td class="num">'+fmtM(r.credit)+'</td><td class="num"><b>'+fmtM(r.closing)+'</b></td></tr>';
  });
  h+='<tr style="background:#eef1f5;font-weight:700"><td>الإجمالي الكلي</td><td class="num">'+fmtM(tb.total.opening)+'</td><td class="num">'+fmtM(tb.total.debit)+'</td><td class="num">'+fmtM(tb.total.credit)+'</td><td class="num">'+fmtM(tb.total.closing)+'</td></tr>';
  h+='</table></div>';
  return h;
}
function openStatement(cid){state.ui.statementClientId=cid;render();}
function backToTrial(){state.ui.statementClientId=null;render();}
function editOpening(cid){
  var cl=clientById(cid);if(!cl)return;
  var v=prompt("الرصيد الافتتاحي للعميل "+cl.name+":",String(cl.openingBalance||0));
  if(v===null)return;
  var r=setOpeningBalance(cid,v);
  if(r.error){alert(r.error);return;}
  render();
}
/* ---------- المستخدمون (المدير العام فقط) ---------- */
function screenUsers(){
  var h='<div class="card"><h2>المستخدمون</h2><p class="muted">إنشاء المستخدمين فقط من داخل النظام وبواسطة المدير العام — لا يوجد تسجيل من شاشة الدخول.</p><div id="usrMsg"></div>'+
  '<div class="form-grid">'+
  '<div><label>اسم المستخدم *</label><input id="nuUser" class="inp"></div>'+
  '<div><label>كلمة المرور *</label><input id="nuPass" class="inp"></div>'+
  '<div><label>الاسم الكامل</label><input id="nuName" class="inp"></div>'+
  '<div><label>الدور *</label><select id="nuRole" class="inp">'+Object.keys(ROLES).map(function(k){return '<option value="'+k+'">'+esc(ROLES[k].name)+'</option>';}).join("")+'</select></div></div>'+
  '<div class="row" style="margin-top:.6rem"><button type="button" class="btn btn-navy" onclick="doCreateUser()">إنشاء المستخدم</button></div></div>';
  h+='<div class="card"><h2>قائمة المستخدمين</h2><table><tr><th>اسم المستخدم</th><th>الاسم</th><th>الدور</th><th>الحالة</th><th>إجراءات</th></tr>';
  state.users.forEach(function(u){
    h+='<tr><td class="num">'+esc(u.username)+'</td><td>'+esc(u.fullName||"")+'</td><td>'+esc(roleName(u.role))+'</td><td>'+(u.active===false?'<span class="badge b-rejected">موقوف</span>':'<span class="badge b-approved">نشط</span>')+'</td><td>'+
    '<button type="button" class="btn btn-ghost btn-sm" onclick="toggleUser(\''+u.id+'\')">'+(u.active===false?"تفعيل":"إيقاف")+'</button> '+
    '<button type="button" class="btn btn-ghost btn-sm" onclick="resetUserPw(\''+u.id+'\')">إعادة تعيين كلمة المرور</button> '+
    (u.username!=="1"?'<button type="button" class="btn btn-danger btn-sm" onclick="delUser(\''+u.id+'\')">حذف</button>':"")+
    '</td></tr>';
  });
  h+='</table></div>';
  return h;
}
function doCreateUser(){
  var r=createUser($("nuUser").value,$("nuPass").value,$("nuName").value,$("nuRole").value);
  var m=$("usrMsg");
  if(r.error){if(m)m.innerHTML='<div class="err">'+esc(r.error)+'</div>';return;}
  render();var m2=$("usrMsg");if(m2)m2.innerHTML='<div class="okbox">تم إنشاء المستخدم «'+esc(r.user.username)+'» بدور '+esc(roleName(r.user.role))+'.</div>';
}
function toggleUser(uid2){var u=userById(uid2);if(!u)return;updateUser(uid2,{active:u.active===false?true:false});render();}
function resetUserPw(uid2){
  var np=prompt("كلمة المرور الجديدة للمستخدم:","");
  if(!np)return;
  var r=updateUser(uid2,{password:np});
  if(r.error){alert(r.error);return;}
  render();var m=$("usrMsg");if(m)m.innerHTML='<div class="okbox">تمت إعادة تعيين كلمة المرور.</div>';
}
function delUser(uid2){var r=deleteUser(uid2);if(r.error){alert(r.error);return;}render();}
/* ---------- الموظفون والإجازات (الموارد البشرية) ---------- */
function screenEmployees(){
  var h='<div class="card"><h2>الموظفون والإجازات</h2><p class="muted">الموارد البشرية تدير بيانات الموظفين والفنيين والإجازات فقط — لا ترى الأسعار ولا المديونيات.</p><div id="empMsg"></div>'+
  '<div class="form-grid">'+
  '<div><label>اسم الموظف *</label><input id="neName" class="inp"></div>'+
  '<div><label>الوظيفة</label><input id="neJob" class="inp" placeholder="فني / سكرتير / محاسب…"></div>'+
  '<div><label>رقم الجوال</label><input id="nePhone" class="inp"></div></div>'+
  '<div class="row" style="margin-top:.6rem"><button type="button" class="btn btn-navy" onclick="doAddEmployee()">حفظ الموظف</button></div></div>';
  h+='<div class="card"><h2>الموظفون</h2>';
  if(!state.employees.length)h+='<p class="muted">لا توجد بيانات موظفين بعد.</p>';
  else{h+='<table><tr><th>الاسم</th><th>الوظيفة</th><th>الجوال</th></tr>';state.employees.forEach(function(e){h+='<tr><td>'+esc(e.name)+'</td><td>'+esc(e.job||"")+'</td><td class="num" dir="ltr">'+esc(e.phone||"")+'</td></tr>';});h+='</table>';}
  h+='</div><div class="card"><h2>تسجيل إجازة</h2><div class="form-grid">'+
  '<div><label>الموظف *</label><select id="lvEmp" class="inp"><option value="">— اختر —</option>'+state.employees.map(function(e){return '<option value="'+esc(e.id)+'">'+esc(e.name)+'</option>';}).join("")+'</select></div>'+
  '<div><label>من تاريخ</label><input id="lvFrom" type="date" class="inp" value="'+today()+'"></div>'+
  '<div><label>إلى تاريخ</label><input id="lvTo" type="date" class="inp" value="'+today()+'"></div>'+
  '<div><label>نوع الإجازة</label><input id="lvType" class="inp" placeholder="سنوية / مرضية / طارئة"></div></div>'+
  '<div class="row" style="margin-top:.6rem"><button type="button" class="btn btn-navy" onclick="doAddLeave()">تسجيل الإجازة</button></div>';
  if(state.leaves.length){h+='<h3>الإجازات المسجلة</h3><table><tr><th>الموظف</th><th>النوع</th><th>من</th><th>إلى</th></tr>';state.leaves.forEach(function(l){var e=null;state.employees.forEach(function(x){if(String(x.id)===String(l.employeeId))e=x;});h+='<tr><td>'+esc(e?e.name:"—")+'</td><td>'+esc(l.type||"")+'</td><td class="num">'+esc(l.from)+'</td><td class="num">'+esc(l.to)+'</td></tr>';});h+='</table>';}
  return h+'</div>';
}
function doAddEmployee(){
  var name=($("neName").value||"").trim();if(!name){alert("اسم الموظف مطلوب.");return;}
  state.employees.push({id:uid("em"),name:name,job:$("neJob").value,phone:$("nePhone").value,createdAt:nowISO()});
  save();render();
}
function doAddLeave(){
  var emp=$("lvEmp").value;if(!emp){alert("اختر الموظف.");return;}
  state.leaves.push({id:uid("lv"),employeeId:emp,from:$("lvFrom").value,to:$("lvTo").value,type:$("lvType").value,createdAt:nowISO()});
  save();render();
}
/* ---------- الإشعارات والإعدادات ---------- */
function screenNotifications(){
  var list=myNotifications();
  var h='<div class="card"><h2>الإشعارات</h2>';
  if(SYNC.mode==="server")h+='<div class="row" style="margin-bottom:.6rem"><button type="button" class="btn btn-navy" onclick="syncRefresh()">تحديث البيانات من الخادم</button><span id="syncStatus" class="muted"></span></div>';
  else h+='<p class="warn">المزامنة مع الخادم غير مفعّلة هنا: أنت في الوضع المحلي والبيانات على هذا الجهاز فقط. عند توفر قاعدة الخادم على نفس الموقع ستظهر حالة «متصل بالخادم» في الترويسة ويعمل زر التحديث.</p>';
  if(!list.length)h+='<p class="muted">لا توجد إشعارات لك حالياً.</p>';
  list.forEach(function(n){
    h+='<div class="notif'+(n.read?"":" unread")+'"><b>'+esc(n.title)+'</b><div>'+esc(n.body)+'</div><div class="time">'+esc(String(n.createdAt).slice(0,16).replace("T"," "))+(n.read?"":" — غير مقروء")+'</div>'+
    (n.read?"":' <button type="button" class="btn btn-ghost btn-sm" onclick="markRead(\''+n.id+'\')">تعليم كمقروء</button>')+'</div>';
  });
  return h+'</div>';
}
function markRead(nid){for(var i=0;i<state.notifications.length;i++)if(String(state.notifications[i].id)===String(nid))state.notifications[i].read=true;save();render();}
function screenSettings(){
  var s=state.settings[0]||{companyName:"",currency:"ر.س",vatRate:15};
  var h='<div class="card"><h2>الإعدادات</h2><div id="setMsg"></div><div class="form-grid">'+
  '<div><label>اسم الشركة</label><input id="stName" class="inp" value="'+esc(s.companyName)+'"></div>'+
  '<div><label>العملة</label><input id="stCur" class="inp" value="'+esc(s.currency)+'"></div>'+
  '<div><label>نسبة الضريبة %</label><input id="stVat" type="number" min="0" step="0.5" class="inp" value="'+esc(s.vatRate)+'"></div></div>'+
  '<div class="row" style="margin-top:.6rem"><button type="button" class="btn btn-navy" onclick="doSaveSettings()">حفظ الإعدادات</button></div>'+
  '<h3>قاعدة البيانات</h3><p>مفتاح التخزين المحلي: <b class="num">MSHRY_company</b> — النسخة الاحتياطية الواحدة: <b class="num">MSHRY_backup_company</b> — معرّف الشركة على الخادم: <b class="num">mshry-default</b> (منفصل تماماً عن أي نظام آخر على المشروع نفسه).</p>'+
  '<div class="row"><button type="button" class="btn btn-ghost" onclick="downloadBackup()">تنزيل نسخة احتياطية (JSON)</button>'+
  '<label class="btn btn-ghost" style="cursor:pointer">استعادة من ملف نسخة<input type="file" accept=".json" class="hidden" onchange="restoreBackup(this)"></label></div>'+
  '<p class="warn">العمل دون اتصال (أوفلاين) مرحلة ثانية: حالياً يعمل النظام في الوضع المحلي عند غياب الخادم ويحفظ على هذا الجهاز، وتُعاد مزامنة الحفظ عند عودة الاتصال — أما العمل الكامل دون اتصال من عدة أجهزة ثم الدمج فليس في هذه النسخة.</p>'+
  '</div>';
  return h;
}
function doSaveSettings(){
  var s=state.settings[0];if(!s){state.settings=[{id:"main"}];s=state.settings[0];}
  s.companyName=$("stName").value;s.currency=$("stCur").value;s.vatRate=Number($("stVat").value)||15;
  save();render();var m=$("setMsg");if(m)m.innerHTML='<div class="okbox">تم حفظ الإعدادات.</div>';
}
function downloadBackup(){
  try{
    var blob=new Blob([JSON.stringify(state)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="MSHRY-company.json";a.click();
    setTimeout(function(){try{URL.revokeObjectURL(a.href);}catch(e){}},1000);
  }catch(e){alert("تعذّر تنزيل النسخة.");}
}
function restoreBackup(input){
  var f=input&&input.files&&input.files[0];if(!f)return;
  if(typeof FileReader==="undefined"){alert("متصفحك لا يدعم قراءة الملفات.");return;}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var s=JSON.parse(String(rd.result||""));
      if(!s||!s.settings){alert("ملف النسخة غير صالح.");return;}
      var keepUser=state.user;
      state=normalizeState(s);state.user=keepUser;ensureAdminUser();saveLocal();render();
      alert("تمت الاستعادة من النسخة.");
    }catch(e){alert("تعذّر قراءة ملف النسخة.");}
  };
  rd.readAsText(f);
}
/* ---------- الإقلاع ---------- */
function boot(){
  render();
  syncCheck().then(function(isServer){
    if(isServer&&SYNC.token){syncPullFromServer().then(function(){render();});}
  });
  if(typeof document!=="undefined"&&document.addEventListener){
    document.addEventListener("visibilitychange",function(){if(!document.hidden&&SYNC.mode==="server"&&SYNC.token)syncPullFromServer().then(function(){render();});});
  }
}
/* واجهة الاختبار: دوال الحالة والمنطق متاحة عالمياً */
window.MSHRY={
  state:function(){return state;},SYNC:SYNC,COMPANY_KEY:COMPANY_KEY,COMPANY_ID:COMPANY_ID,
  COLLECTIONS:COLLECTIONS,ROLES:ROLES,

  nextSerial:nextSerial,peekSerial:peekSerial,isSerialUsed:isSerialUsed,
  syncCheck:syncCheck,syncMergeRows:syncMergeRows,syncPullFromServer:syncPullFromServer,
  syncPushNow:syncPushNow,syncRefresh:syncRefresh,
  doLogin:doLogin,localLogin:localLogin,logout:logout,
  addClient:addClient,addProject:addProject,assignTechnicians:assignTechnicians,
  confirmReceipt:confirmReceipt,addMedia:addMedia,submitInspection:submitInspection,
  pmDecision:pmDecision,quoteTotals:quoteTotals,createQuotation:createQuotation,
  sendQuotation:sendQuotation,clientResponse:clientResponse,gmApprove:gmApprove,
  gmReject:gmReject,issueMaterial:issueMaterial,allMaterialsIssued:allMaterialsIssued,
  prepareContract:prepareContract,financialApprove:financialApprove,
  recordPayment:recordPayment,setOpeningBalance:setOpeningBalance,
  trialBalance:trialBalance,clientStatement:clientStatement,
  createUser:createUser,updateUser:updateUser,deleteUser:deleteUser,

};
boot();
