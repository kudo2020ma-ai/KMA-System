<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام إدارة مشاريع المقاولات</title>
<style>
:root{--navy:#0f2a4a;--navy2:#163a63;--gold:#c9a227;--gold2:#e3c766;--bg:#f2f4f7;--card:#fff;--border:#d8dee6;--text:#1c2733;--muted:#66788c;--red:#b3261e;--green:#1e7d32;--amber:#8a6d00;--r:10px}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--navy)}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:.9rem}
.num{direction:ltr;unicode-bidi:embed}
.warn{background:#fff4e0;border:1px solid #e8c26a;color:#6d5200;border-radius:8px;padding:.6rem .8rem;margin:.5rem 0;line-height:1.7}
.err{background:#fdecea;border:1px solid #e8a49f;color:var(--red);border-radius:8px;padding:.6rem .8rem;margin:.5rem 0;line-height:1.7}
.okbox{background:#e8f5e9;border:1px solid #a5d6a7;color:var(--green);border-radius:8px;padding:.6rem .8rem;margin:.5rem 0;line-height:1.7}
/* شاشة الدخول */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 60%,#0a1d33 100%)}
.login-card{background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.35);width:100%;max-width:420px;padding:2rem 1.8rem}
.login-card h1{color:var(--navy);text-align:center;margin:.2rem 0 .2rem;font-size:1.35rem}
.login-card .sub{text-align:center;color:var(--muted);margin:0 0 1.2rem}
.gold-bar{height:4px;background:var(--gold);border-radius:4px;margin:0 auto 1rem;width:90px}
label{display:block;font-weight:600;margin:.7rem 0 .25rem}
.inp{width:100%;padding:.6rem .7rem;border:1px solid var(--border);border-radius:8px;font-size:1rem;font-family:inherit}
.inp:focus{outline:2px solid var(--gold);border-color:var(--gold)}
select.inp{cursor:pointer}
textarea.inp{resize:vertical;min-height:70px}
.pw-wrap{position:relative}
.pw-wrap .inp{padding-left:2.6rem}
.eye{position:absolute;left:.4rem;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:1.15rem;color:var(--navy)}
.btn{display:inline-block;border:0;border-radius:8px;padding:.6rem 1.2rem;font-size:1rem;font-family:inherit;cursor:pointer;font-weight:700}
.btn-navy{background:var(--navy);color:#fff;width:100%}
.btn-navy:hover{background:var(--navy2)}
.btn-gold{background:var(--gold);color:#231f00}
.btn-ghost{background:#eef1f5;color:var(--navy)}
.btn-danger{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-sm{padding:.35rem .7rem;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* التطبيق */
header{background:var(--navy);color:#fff;padding:.6rem 1rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header .brand{font-weight:800;font-size:1.1rem}
header .brand span{color:var(--gold2)}
.sync-badge{font-size:.82rem;border-radius:20px;padding:.25rem .7rem;background:#33475e;color:#dbe4ee}
.sync-badge.sync-server{background:#1e7d32;color:#fff}
.sync-badge.sync-local{background:#7a5b00;color:#fff}
.sync-badge.sync-warn{background:#b3261e;color:#fff}
.user-chip{font-size:.9rem}
.user-chip button{margin-right:.5rem}
nav.tabs{background:#fff;border-bottom:2px solid var(--gold);display:flex;flex-wrap:wrap;gap:.2rem;padding:.3rem .8rem;position:sticky;top:52px;z-index:9}
nav.tabs button{border:0;background:none;padding:.55rem .8rem;font-family:inherit;font-size:.95rem;cursor:pointer;border-radius:8px;color:var(--navy);font-weight:600}
nav.tabs button.on{background:var(--navy);color:#fff}
nav.tabs button:hover{background:#eef1f5}
nav.tabs button.on:hover{background:var(--navy)}
main{max-width:1180px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem;margin-bottom:1rem}
.card h2{margin:.1rem 0 .7rem;color:var(--navy);font-size:1.15rem}
.card h3{margin:.8rem 0 .4rem;color:var(--navy);font-size:1rem}
.grid{display:grid;gap:1rem}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.stat{background:var(--navy);color:#fff;border-radius:var(--r);padding:.9rem 1rem}
.stat .n{font-size:1.7rem;font-weight:800;color:var(--gold2)}
.stat .t{font-size:.9rem;opacity:.9}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{border:1px solid var(--border);padding:.45rem .55rem;text-align:right;vertical-align:top}
th{background:var(--navy);color:#fff}
tr:nth-child(even) td{background:#f7f9fb}
.badge{display:inline-block;border-radius:12px;padding:.1rem .6rem;font-size:.82rem;font-weight:700}
.b-new{background:#e3ecf7;color:var(--navy)}
.b-assigned{background:#fff3cd;color:#6d5200}
.b-inspected{background:#d1ecf1;color:#0b5563}
.b-quoted{background:#e2e3f5;color:#3c3f8a}
.b-accepted{background:#d4edda;color:var(--green)}
.b-rejected,.b-cancelled{background:#f8d7da;color:var(--red)}
.b-approved{background:#d4edda;color:var(--green)}
.b-draft{background:#eceff1;color:#455a64}
.b-sent{background:#fff3cd;color:#6d5200}
.b-issued{background:#e8f5e9;color:var(--green)}
.b-done{background:#d4edda;color:var(--green)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.row .grow{flex:1;min-width:180px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.6rem 1rem}
.thumb{width:110px;height:90px;object-fit:cover;border:1px solid var(--border);border-radius:8px}
.media-item{display:inline-block;margin:.3rem;text-align:center;max-width:130px;vertical-align:top}
.linklike{background:none;border:0;color:var(--navy);cursor:pointer;font-weight:700;text-decoration:underline;font-family:inherit;font-size:inherit;padding:0}
.notif{border:1px solid var(--border);border-right:4px solid var(--gold);border-radius:8px;padding:.6rem .8rem;margin-bottom:.5rem;background:#fff}
.notif.unread{background:#fffbe6}
.notif .time{color:var(--muted);font-size:.82rem}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1rem}
/* الطباعة على الترويسة الرسمية: كل صفحة A4 كاملة بخلفية الترويسة —
   الشريط الذهبي يساراً، الشعار والاسم أعلى اليمين، والتذييل أسفل الصفحة.
   المحتوى في المنطقة الوسطى الفارغة فقط (38مم من الأعلى، 44مم من الأسفل). */
#printArea{display:none}
@media print{
  body{background:#fff}
  #app,header,nav.tabs,footer{display:none!important}
  #printArea{display:block;position:static}
  @page{size:A4;margin:0}
  .print-page{page-break-after:always;box-shadow:none!important;margin:0!important}
  .print-page:last-child{page-break-after:auto}
}

.print-content{font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#000;font-size:12.5px;line-height:1.6}
.print-content h1{font-size:17px;text-align:center;margin:0 0 2px}
.print-content h2{font-size:13px;text-align:center;margin:0 0 8px;color:#333;font-weight:600}
.print-content table{width:100%;border-collapse:collapse;font-size:12.5px}
.print-content th,.print-content td{border:1px solid #555;padding:4px 6px;text-align:right}
.print-content th{background:#eee;color:#111}
.print-content tr{break-inside:avoid}
.print-content .cont-line{text-align:center;font-weight:700;margin:0 0 6px}
/* الكثافة العالية للعروض الطويلة: 36 صفاً في الصفحة الواحدة —
   صف ~4.4مم فيرتفع 36 صفاً + العنوان + رأس الجدول ≈ 181مم
   داخل ميزانية المحتوى 215مم، فيبقى التذييل بعيداً عن الجدول */
.print-content.dense{font-size:10.5px;line-height:1.3}
.print-content.dense h1{font-size:14px}
.print-content.dense h2{font-size:11px}
.print-content.dense th,.print-content.dense td{padding:1px 4px}
/* شاشة إدارة الحسابات — الثيم الأزرق الداكن */
.acc{background:linear-gradient(160deg,#04122e 0%,#071d45 55%,#0a2a5e 100%);color:#eaf1fb;border-radius:12px;padding:1rem}
.acc .acc-head{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.acc h2{color:#fff;margin:.1rem 0}
.acc .acc-grid{display:grid;grid-template-columns:1fr 210px;gap:1rem;align-items:start}
.acc .acc-side{display:flex;flex-direction:column;gap:.5rem;min-width:170px}
.acc .acc-side .btn{width:100%;text-align:right}
.acc .acc-side .btn.on{background:var(--gold);color:#231f00}
.acc .sumcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin:.8rem 0}
.acc .sumcard{border-radius:12px;padding:.8rem .9rem;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.acc .sumcard .t{font-size:.9rem;opacity:.95}
.acc .sumcard .n{font-size:1.5rem;font-weight:800;direction:ltr;text-align:right}
.acc .c-bank{background:linear-gradient(135deg,#0b5ed7,#084298)}
.acc .c-safe{background:linear-gradient(135deg,#198754,#0b5e33)}
.acc .c-exp{background:linear-gradient(135deg,#9333a6,#5b2168)}
.acc .c-rev{background:linear-gradient(135deg,#157347,#0c4d2e)}
.acc .panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:.8rem 1rem;margin-bottom:1rem}
.acc .panel h3{color:#ffd76a;margin:.1rem 0 .6rem}
.acc table{color:#eaf1fb}
.acc th{background:#0b2c5e;color:#fff}
.acc td{border-color:rgba(255,255,255,.16)}
.acc tr:nth-child(even) td{background:rgba(255,255,255,.04)}
.acc .bars{display:flex;align-items:flex-end;gap:1rem;height:150px;padding-top:.5rem}
.acc .bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:.2rem}
.acc .bar-pair{display:flex;gap:.3rem;align-items:flex-end;height:120px}
.acc .bar{width:22px;border-radius:4px 4px 0 0}
.acc .bar-rev{background:#2f9e44}
.acc .bar-exp{background:#e03131}
.acc .donut-wrap{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.acc .donut{width:130px;height:130px;border-radius:50%;flex:none;position:relative}
.acc .donut::after{content:"";position:absolute;inset:28px;background:#071d45;border-radius:50%}
.acc .legend{font-size:.9rem;line-height:1.9}
.acc .legend .dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:.3rem}
@media screen and (max-width:760px){.acc .acc-grid{grid-template-columns:1fr}}
@media screen and (max-width:640px){main{padding:.6rem}nav.tabs{top:96px}.stat .n{font-size:1.4rem}}
/* نافذة اختيار الأصناف (F9) وقائمة الإكمال التلقائي */
.item-modal{position:fixed;inset:0;background:rgba(15,42,74,.55);display:flex;align-items:flex-start;justify-content:center;padding:4rem 1rem 1rem;z-index:50}
.item-modal-card{background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);width:100%;max-width:560px;padding:1rem 1.2rem}
.item-modal-card h3{margin:.1rem 0 .6rem;color:var(--navy)}
.item-suggest{border:1px solid var(--border);background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15);margin-top:.25rem;max-height:220px;overflow:auto}
.item-pick-row{padding:.45rem .6rem;cursor:pointer;line-height:1.6}
.item-pick-row:hover{background:#eef1f5}
</style>

<script>
/* ---------- الحالة والتخزين المحلي ---------- */
function defState(){return {
  users:[],clients:[],projects:[],assignments:[],media:[],quotations:[],
  approvals:[],contracts:[],material_issues:[],payments:[],notifications:[],
  material_returns:[],transactions:[],items:[],audit_log:[],
  settings:[{id:"main",companyName:"شركة بصمة المشاعر المتطورة",companyNameEn:"BASSMAT ALMASHAEIR ADVANCED COMPANY",commercialReg:"4031264916",address:"المملكة العربية السعودية — العزيزية، شارع عبدالله الخياط",phones:"0555645215 - 0125124905",email:"bassmat.co@gmail.com",currency:"ر.س",vatRate:15,setupCode:"1805",bankBalance:0,safeBalance:0,ownerName:"",ownerPhone:"",taxNumber:"",city:"",district:"",street:"",buildingNo:"",postalCode:"",subNumber:""}],
  counters:[{id:"main",project:0,quotation:0,contract:0,payment:0,client:0,"return":0,transaction:0,item:0}],
  employees:[],leaves:[]
};}
function loadState(){
  var raw=null;
  try{raw=localStorage.getItem(COMPANY_KEY);}catch(e){}
  if(raw){try{var s=JSON.parse(raw);if(s&&s.settings){return normalizeState(s);}}catch(e){}}
  try{var bk=localStorage.getItem(BKKEY);if(bk){var s2=JSON.parse(bk);if(s2&&s2.settings){try{localStorage.setItem(COMPANY_KEY,bk);}catch(e){}return normalizeState(s2);}}}catch(e){}
  return defState();
}
function normalizeState(s){
  var d=defState();
  COLLECTIONS.forEach(function(c){if(Array.isArray(s[c]))d[c]=s[c];});
  if(Array.isArray(s.employees))d.employees=s.employees;
  if(Array.isArray(s.leaves))d.leaves=s.leaves;
  /* دمج الإعدادات مع الافتراضيات: سجلات قديمة بلا الحقول الجديدة
     (بيانات المالك والعنوان الوطني والرقم الضريبي) تُملأ بقيمها
     الافتراضية الفارغة بدل تركها undefined. */
  if(Array.isArray(d.settings)&&d.settings.length){
    var ds=defState().settings[0];
    Object.keys(ds).forEach(function(k){if(d.settings[0][k]===undefined)d.settings[0][k]=ds[k];});
  }
  d.clients.forEach(function(c){if(c.taxNumber===undefined)c.taxNumber="";});
  if(!Array.isArray(d.items))d.items=[];
  return d;
}
var state=loadState();
state.user=null;state.screen="dashboard";state.ui={};
function defaultAdminUser(){return {id:"u-1",username:"1",password:"1",fullName:"المدير العام",role:"gm",phone:"",permissions:null,companyId:COMPANY_ID,active:true,createdAt:nowISO()};}
function ensureAdminUser(){
  if(!Array.isArray(state.users))state.users=[];
  var found=null;
  for(var i=0;i<state.users.length;i++){if(state.users[i]&&state.users[i].username==="1"){found=state.users[i];break;}}
  if(!found){found=defaultAdminUser();state.users.unshift(found);}
  return found;
}
/* يُزرع المدير 1/1 فقط عند غياب حساب "1" تماماً. إن وُجد — حتى بعد تغيير
   كلمة مروره أو إيقافه — لا يُمسّ إطلاقاً. */
ensureAdminUser();
function saveLocal(){try{var j=JSON.stringify(state);localStorage.setItem(COMPANY_KEY,j);localStorage.setItem(BKKEY,j);localStorage.setItem(BKMETA,new Date().toISOString());}catch(e){}}
function save(){saveLocal();scheduleSyncPush();}
function counters(){if(!state.counters||!state.counters.length)state.counters=[{id:"main",project:0,quotation:0,contract:0,payment:0,client:0,"return":0,transaction:0,item:0}];return state.counters[0];}
function nextSerial(kind,prefix){
  var c=counters();c[kind]=(Number(c[kind])||0)+1;
  var n=prefix+"-"+String(c[kind]).padStart(4,"0");
  while(isSerialUsed(kind,n)){c[kind]++;n=prefix+"-"+String(c[kind]).padStart(4,"0");}
  return n;
}
function isSerialUsed(kind,num){
  var list=kind==="project"?state.projects:kind==="quotation"?state.quotations:kind==="item"?state.items:state.contracts;
  var field=kind==="item"?"code":"number";
  for(var i=0;i<list.length;i++){if(String(list[i][field])===String(num))return true;}
  return false;
}
function peekSerial(kind,prefix){var c=counters();return prefix+"-"+String((Number(c[kind])||0)+1).padStart(4,"0");}

/* ---------- المزامنة مع قاعدة الخادم (العقد المعتمد نفسه) ---------- */
var SYNC={mode:"local",token:null,companyId:null,busy:false,lastSync:null,checked:false,serverMode:null,serverHealthy:true,pushFailed:0};
var SYNC_COLLECTIONS=[["users","users"],["clients","clients"],["projects","projects"],["assignments","assignments"],["media","media"],["quotations","quotations"],["approvals","approvals"],["contracts","contracts"],["material_issues","material_issues"],["payments","payments"],["notifications","notifications"],["settings","settings"],["counters","counters"],["material_returns","material_returns"],["transactions","transactions"],["items","items"],["audit_log","audit_log"]];
var SYNC_PUSH_TIMER=null;
function syncHeaders(){var h={"Content-Type":"application/json"};if(SYNC.token)h["Authorization"]="Bearer "+SYNC.token;return h;}
function syncSetBadge(){
  var b=$("syncBadge");if(!b)return;
  if(SYNC.mode==="server"&&SYNC.serverHealthy&&SYNC.pushFailed===0){b.className="sync-badge sync-server";b.textContent="متصل بالخادم — بيانات الشركة مشتركة";}
  else if(SYNC.mode==="server"&&SYNC.pushFailed>0){b.className="sync-badge sync-warn";b.textContent="تحذير: تعذّر حفظ آخر "+SYNC.pushFailed+" عملية على الخادم — البيانات محفوظة على هذا الجهاز وستُعاد المحاولة";}
  else if(SYNC.mode==="server"){b.className="sync-badge sync-server";b.textContent="الخادم متصل لكن الحفظ عليه تعذّر — البيانات محفوظة على هذا الجهاز فقط";}
  else if(SYNC.serverMode==="local-json"){b.className="sync-badge sync-local";b.textContent="قاعدة الخادم غير متصلة بعد، البيانات على هذا الجهاز فقط";}
  else{b.className="sync-badge sync-local";b.textContent="وضع محلي — البيانات على هذا الجهاز فقط";}
}
function syncNote(){
  var n=$("loginModeNote");if(!n)return;
  if(SYNC.mode==="server"){n.textContent="متصل بالخادم: بيانات الشركة محفوظة مركزياً في قاعدة البيانات الواحدة المشتركة، وتظهر على جميع الأجهزة بعد الدخول بنفس الحساب. إنشاء المستخدمين يكون من داخل النظام عبر شاشة المستخدمين وبواسطة المدير العام فقط.";}
  else if(SYNC.serverMode==="local-json"){n.textContent="تنبيه: قاعدة بيانات الخادم المشتركة غير متصلة بعد — الخادم يعمل بوضع التخزين المحلي المؤقت الذي لا يحفظ بين الطلبات، فالبيانات محفوظة على هذا الجهاز فقط الآن ولن تظهر على جهاز آخر. إنشاء المستخدمين يكون من داخل النظام عبر شاشة المستخدمين وبواسطة المدير العام فقط.";}
  else{n.textContent="إنشاء المستخدمين يكون من داخل النظام عبر شاشة المستخدمين وبواسطة المدير العام فقط — لا يوجد تسجيل من شاشة الدخول.";}
}
function syncCheck(){
  if(typeof fetch!=="function"){SYNC.checked=true;syncSetBadge();return Promise.resolve(false);}
  if(typeof location!=="undefined"&&location.protocol==="file:"){SYNC.checked=true;syncSetBadge();return Promise.resolve(false);}
  var ctl=null;try{ctl=new AbortController();}catch(e){ctl=null;}
  var to=null;if(ctl)to=setTimeout(function(){try{ctl.abort();}catch(e){}},3000);
  return fetch("/api/health",{cache:"no-store",signal:ctl?ctl.signal:undefined}).then(function(r){
    if(to)clearTimeout(to);if(!r.ok)throw new Error("health "+r.status);return r.json();
  }).then(function(j){
    if(j&&j.ok){SYNC.serverMode=j.mode||null;if(j.mode==="postgres"){SYNC.mode="server";SYNC.serverHealthy=true;}else{SYNC.mode="local";}}
    SYNC.checked=true;syncSetBadge();syncNote();return SYNC.mode==="server";
  }).catch(function(){
    if(to)clearTimeout(to);SYNC.mode="local";SYNC.serverMode=null;SYNC.checked=true;syncSetBadge();syncNote();return false;
  });
}
function syncNormRows(rows){
  if(!Array.isArray(rows))return [];
  return rows.map(function(row){
    if(row&&typeof row==="object"&&row.data&&typeof row.data==="object"){
      var d={};for(var k in row.data)if(Object.prototype.hasOwnProperty.call(row.data,k))d[k]=row.data[k];
      if(row.id!==undefined&&d.id===undefined)d.id=row.id;return d;
    }return row;
  });
}
function apiGet(coll){return fetch("/api/data?collection="+encodeURIComponent(coll),{headers:syncHeaders(),cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("get "+coll+" "+r.status);return r.json();}).then(function(j){if(Array.isArray(j))return syncNormRows(j);if(j&&Array.isArray(j.records))return syncNormRows(j.records);if(j&&Array.isArray(j.data))return syncNormRows(j.data);return [];});}
function apiPost(coll,id,data){return fetch("/api/data",{method:"POST",headers:syncHeaders(),body:JSON.stringify({collection:coll,id:id,companyId:COMPANY_ID,data:data})}).then(function(r){if(!r.ok)throw new Error("post "+coll+" "+r.status);return r.json().catch(function(){return {};});});}
function apiDel(coll,id){return fetch("/api/data?collection="+encodeURIComponent(coll)+"&id="+encodeURIComponent(id),{method:"DELETE",headers:syncHeaders()}).then(function(r){if(!r.ok)throw new Error("del "+coll+" "+r.status);return r.json().catch(function(){return {};});});}
/* دمج آمن: اتحاد صفوف الخادم والمحلية حسب المعرّف (الخادم يفوز عند التعارض
   بالأحدث updatedAt، وبلا طابع زمني يفوز الخادم)، ولا يُمحى أي صف محلي
   أبداً لأن الخادم أعاد قائمة فارغة. */
function syncMergeRows(localRows,serverRows){
  var out=[];var seen={};
  function key(r){return (r&&r.id!==undefined&&r.id!==null)?String(r.id):null;}
  function upd(r){return (r&&r.updatedAt)?String(r.updatedAt):"";}
  (serverRows||[]).forEach(function(row){if(!row)return;out.push(row);var k=key(row);if(k!==null)seen[k]=row;});
  (localRows||[]).forEach(function(row){
    if(!row)return;var k=key(row);
    if(k===null||!seen[k]){out.push(row);return;}
    var srv=seen[k];
    if(upd(row)>upd(srv)){var ix=out.indexOf(srv);if(ix>=0)out[ix]=row;}
  });
  return out;
}
function syncPullFromServer(){
  if(SYNC.mode!=="server"||!SYNC.token)return Promise.resolve(false);
  SYNC.busy=true;
  var jobs=SYNC_COLLECTIONS.map(function(pair){
    return apiGet(pair[0]).then(function(rows){return {key:pair[1],rows:rows};}).catch(function(){return {key:pair[1],rows:null};});
  });
  return Promise.all(jobs).then(function(results){
    var changed=false;var serverEmptyEverywhere=true;var localHasData=false;
    results.forEach(function(res){
      if(!res||res.rows===null)return;
      if(res.rows.length)serverEmptyEverywhere=false;
      var local=state[res.key]||[];
      if(local.length)localHasData=true;
      var merged=syncMergeRows(local,res.rows);
      if(JSON.stringify(merged)!==JSON.stringify(local)){state[res.key]=merged;changed=true;}
    });
    ensureAdminUser();
    if(changed)saveLocal();
    SYNC.lastSync=new Date().toISOString();SYNC.busy=false;syncSetBadge();
    /* إن كان الخادم فارغاً تماماً والمحلي فيه بيانات: تُدفع البيانات المحلية إلى الخادم */
    if(serverEmptyEverywhere&&localHasData){return syncPushNow().then(function(){return true;});}
    return changed;
  }).catch(function(){SYNC.busy=false;return false;});
}
function scheduleSyncPush(){
  if(SYNC.mode!=="server"||!SYNC.token)return;
  if(SYNC_PUSH_TIMER)return;
  SYNC_PUSH_TIMER=setTimeout(function(){SYNC_PUSH_TIMER=null;syncPushNow();},800);
}
/* الدفع يعدّ الفشل ولا يبتلعه بصمت: إن فشل أي حفظ على الخادم تُعرض شارة
   تحذير وتبقى البيانات محفوظة محلياً، وتُعاد المحاولة عند الحفظ التالي. */
function syncPushNow(){
  if(SYNC.mode!=="server"||!SYNC.token||SYNC.busy)return Promise.resolve(false);
  SYNC.busy=true;var jobs=[];
  SYNC_COLLECTIONS.forEach(function(pair){
    var rows=state[pair[1]]||[];
    rows.forEach(function(row){
      if(!row||row.id===undefined)return;
      jobs.push(apiPost(pair[0],String(row.id),row).then(function(){return true;}).catch(function(){return false;}));
    });
  });
  return Promise.all(jobs).then(function(res){
    var failed=0;res.forEach(function(ok){if(!ok)failed++;});
    SYNC.pushFailed=failed;SYNC.busy=false;
    if(failed===0)SYNC.lastSync=new Date().toISOString();
    else SYNC.serverHealthy=false;
    syncSetBadge();return failed===0;
  }).catch(function(){SYNC.pushFailed=1;SYNC.busy=false;syncSetBadge();return false;});
}
function syncRefresh(){
  var s=$("syncStatus");if(s)s.textContent="جارٍ التحديث من الخادم…";
  syncPullFromServer().then(function(ok){
    if(s)s.textContent=ok?"تم التحديث من الخادم.":"تعذّر التحديث من الخادم — البيانات المعروضة هي المحلية.";
    render();
  });
}

function serverLogin(un,pw){
  /* يُرسل companyId الخاص بهذا النظام ("mshry-default") مع طلب الدخول
     حتى تعزل الواجهة الخلفية مستخدميه وبياناته عن أي نظام آخر على
     المشروع نفسه؛ وسجلات المستخدمين نفسها تحمل companyId أيضاً. */
  return fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:un,password:pw,companyId:COMPANY_ID})}).then(function(r){
    if(!r.ok)throw new Error("auth "+r.status);return r.json();
  }).then(function(j){
    if(!j||!j.token||!j.user)throw new Error("bad auth");
    SYNC.token=j.token;SYNC.companyId=j.companyId||null;
    try{sessionStorage.setItem("MSHRY_sync_token",j.token);}catch(e){}
    return j.user;
  });
}
function findLocalUser(un){
  for(var i=0;i<state.users.length;i++){if(state.users[i]&&String(state.users[i].username)===String(un))return state.users[i];}
  return null;
}
/* دخول احتياطي محلي: عند فشل دخول الخادم يُقبل مستخدم موجود محلياً
   بنفس كلمة المرور المخزنة محلياً. */
function localLogin(un,pw){
  var u=findLocalUser(un);
  if(!u)return null;
  if(u.active===false)return {error:"هذا الحساب موقوف — راجع المدير العام."};
  if(String(u.password)!==String(pw))return null;
  return {username:u.username,fullName:u.fullName||u.username,role:u.role};
}
function doLogin(){
  var un=($("loginUser")?$("loginUser").value:"").trim();
  var pw=$("loginPass")?$("loginPass").value:"";
  var err=$("loginErr");
  function fail(msg){if(err){err.textContent=msg;err.classList.remove("hidden");}}
  if(!un||!pw){fail("أدخل اسم المستخدم وكلمة المرور.");return Promise.resolve(false);}
  function finish(userObj){
    var u=findLocalUser(userObj.username);
    if(!u){fail("بيانات الدخول غير صحيحة.");return false;}
    if(u.active===false){fail("هذا الحساب موقوف — راجع المدير العام.");return false;}
    state.user={id:u.id,username:u.username,fullName:u.fullName||u.username,role:u.role,permissions:Array.isArray(u.permissions)?u.permissions.slice():null};
    logAudit("login_success","تسجيل دخول ناجح للمستخدم "+u.username+" ("+roleName(u.role)+")","","الدخول");
    state.screen=(u.role==="technician")?"tasks":(u.role==="hr"?"employees":(u.role==="storekeeper"?"materials":(u.role==="secretariat"?"contracts":"dashboard")));
    if(err)err.classList.add("hidden");
    saveLocal();
    if(SYNC.mode==="server")syncPullFromServer().then(function(){render();});
    render();
    return true;
  }
  if(SYNC.mode==="server"){
    return serverLogin(un,pw).then(function(userObj){return finish(userObj);}).catch(function(){
      var local=localLogin(un,pw);
      if(local&&!local.error)return finish(local);
      if(local&&local.error){fail(local.error);return false;}
      fail("بيانات الدخول غير صحيحة.");return false;
    });
  }
  var local2=localLogin(un,pw);
  if(local2&&!local2.error)return Promise.resolve(finish(local2));
  if(local2&&local2.error){logAudit("login_failed","محاولة دخول فاشلة للمستخدم "+un+" — "+local2.error,"","الدخول",{username:un,fullName:un,role:"—"});saveLocal();fail(local2.error);return Promise.resolve(false);}
  logAudit("login_failed","محاولة دخول فاشلة للمستخدم "+un+" — بيانات غير صحيحة","","الدخول",{username:un,fullName:un,role:"—"});saveLocal();
  fail("بيانات الدخول غير صحيحة.");return Promise.resolve(false);
}
function logout(){
  if(state.user){logAudit("logout","تسجيل خروج المستخدم "+(state.user.fullName||state.user.username)+" ("+state.user.username+")","","الدخول");saveLocal();if(SYNC.mode==="server"&&SYNC.token)syncPushNow();}
  state.user=null;state.screen="dashboard";try{sessionStorage.removeItem("MSHRY_sync_token");}catch(e){}SYNC.token=null;render();
}

/* الصلاحيات الفعلية للمستخدم: المدير العام يرى كل الشاشات دائماً؛
   غيره يرى قائمة permissions الخاصة به إن كانت مصفوفة، وإلا
   افتراضي دوره من ROLE_SCREENS. السجل الكامل للمستخدم (وفيه

function myNotifications(){

<script>
/* ---------- منطق العمل ---------- */
function addClient(name,phone,address,openingBalance,taxNumber){
  name=String(name||"").trim();if(!name)return {error:"اسم العميل مطلوب."};
  var c={id:uid("cl"),name:name,phone:String(phone||"").trim(),address:String(address||"").trim(),taxNumber:String(taxNumber||"").trim(),openingBalance:Number(openingBalance)||0,createdAt:nowISO(),updatedAt:nowISO()};
  state.clients.push(c);logAudit("create_client","إنشاء عميل جديد: "+c.name+(c.phone?" — "+c.phone:""),"","إدارة المشاريع");save();return {client:c};
}
function addProject(clientId,type,title,address,description,number){
  var cl=clientById(clientId);if(!cl)return {error:"اختر عميلاً موجوداً أو سجّل عميلاً جديداً أولاً."};
  if(PROJECT_TYPES.indexOf(type)<0)type="أخرى";
  number=String(number||"").trim()||nextSerial("project","P");
  if(isSerialUsed("project",number))return {error:"رقم المشروع «"+number+"» مستخدم من قبل — أدخل رقماً آخر."};
  var p={id:uid("pr"),number:number,clientId:cl.id,clientName:cl.name,type:type,title:String(title||"").trim()||type,address:String(address||cl.address||"").trim(),description:String(description||"").trim(),status:"new",createdAt:nowISO(),updatedAt:nowISO()};
  state.projects.push(p);logAudit("create_project","إنشاء مشروع "+p.number+" للعميل "+cl.name+" — "+p.type,p.number,"إدارة المشاريع");save();return {project:p};
}
function assignTechnicians(projectId,technicianIds){
  var p=projectById(projectId);if(!p)return {error:"المشروع غير موجود."};
  if(!technicianIds||!technicianIds.length)return {error:"اختر فنياً واحداً على الأقل."};
  var assigned=[];
  technicianIds.forEach(function(tid){
    var t=userById(tid);if(!t||t.role!=="technician")return;
    var exists=null;
    state.assignments.forEach(function(a){if(String(a.projectId)===String(projectId)&&String(a.technicianId)===String(tid))exists=a;});
    if(exists)return;
    var a={id:uid("as"),projectId:p.id,technicianId:t.id,technicianName:t.fullName||t.username,status:"pending",notifiedAt:nowISO(),acceptedAt:null};
    state.assignments.push(a);assigned.push(a);
    var clPhone="—";var _cl=clientById(p.clientId);if(_cl&&_cl.phone)clPhone=_cl.phone;
    notifyUser(t.id,"مهمة جديدة: "+p.title,"العنوان: "+p.address+" — العميل: "+p.clientName+" ("+clPhone+") — العمل المطلوب: "+p.description+" — نوع المشروع: "+p.type,{projectId:p.id});
  });
  if(!assigned.length)return {error:"الفنيون المختارون مُسندون لهذا المشروع من قبل."};
  p.status="assigned";p.updatedAt=nowISO();logAudit("assign","إسناد فنيين للمشروع "+p.number+": "+assigned.map(function(a){return a.technicianName;}).join("، "),p.number,"إدارة المشاريع");save();return {assigned:assigned};
}
function confirmReceipt(assignmentId){
  var a=null;for(var i=0;i<state.assignments.length;i++)if(String(state.assignments[i].id)===String(assignmentId))a=state.assignments[i];
  if(!a)return {error:"المهمة غير موجودة."};
  if(!state.user)return {error:"سجّل دخولك أولاً."};
  if(String(a.technicianId)!==String(state.user.id))return {error:"هذه المهمة ليست لك — الاعتماد يتم بيوزر الفني المسندة إليه المهمة."};
  if(a.status==="accepted")return {error:"المهمة معتمدة من الفني بالفعل."};
  a.status="accepted";a.acceptedAt=nowISO();var _cp=projectById(a.projectId);logAudit("confirm_receipt","اعتماد الفني «"+(a.technicianName||state.user.username)+"» للمهمة — المشروع "+(_cp?_cp.number:""),_cp?_cp.number:"","مهامي");save();return {assignment:a};
}
function addMedia(projectId,kind,name,size,dataUrl,note){
  var p=projectById(projectId);if(!p)return {error:"المشروع غير موجود."};
  if(kind==="photo"&&!dataUrl)return {error:"لم تُرفق صورة."};
  var m={id:uid("md"),projectId:p.id,kind:kind,name:String(name||"").trim()||(kind==="photo"?"صورة":"فيديو"),size:Number(size)||0,dataUrl:kind==="photo"?dataUrl:null,note:String(note||"").trim(),uploadedBy:state.user?state.user.username:"—",createdAt:nowISO()};

function submitInspection(projectId){
  var p=projectById(projectId);if(!p)return {error:"المشروع غير موجود."};
  var photos=state.media.filter(function(m){return String(m.projectId)===String(projectId)&&m.kind==="photo";});
  if(!photos.length)return {error:"ارفع صورة واحدة على الأقل للموقع قبل إرسال تقرير المعاينة."};
  p.status="inspected";p.updatedAt=nowISO();logAudit("submit_inspection","إرسال تقرير معاينة المشروع "+p.number,p.number,"مهامي");save();
  notifyRole("projects_manager","تقرير معاينة جاهز: "+p.title,"الفني أرسل صور وفيديو المعاينة للمشروع "+p.number+" ("+p.clientName+") — راجعها واقبل أو ارفض بسبب موثق.",{projectId:p.id});
  return {project:p};
}
function pmDecision(projectId,decision,reason){
  var p=projectById(projectId);if(!p)return {error:"المشروع غير موجود."};
  if(decision==="accept"){p.status="inspected";p.updatedAt=nowISO();logAudit("inspection_accept","قبول معاينة المشروع "+p.number,p.number,"إدارة المشاريع");save();return {project:p};}
  reason=String(reason||"").trim();
  if(!reason)return {error:"الرفض يتطلب سبباً موثقاً — اكتب السبب."};
  p.status="inspection_rejected";p.inspectionRejectReason=reason;p.updatedAt=nowISO();logAudit("inspection_reject","رفض معاينة المشروع "+p.number+" — السبب: "+reason,p.number,"إدارة المشاريع");save();
  state.assignments.forEach(function(a){if(String(a.projectId)===String(p.id))notifyUser(a.technicianId,"رفض معاينة المشروع "+p.number,"سبب الرفض: "+reason,{projectId:p.id});});
  return {project:p};
}
function quoteTotals(items,maintenanceAmount){
  var sub=0;(items||[]).forEach(function(it){sub+=(Number(it.qty)||0)*(Number(it.price)||0);});
  var maint=Number(maintenanceAmount)||0;
  var base=sub+maint;
  var vat=Math.round(base*0.15*100)/100;
  return {subtotal:sub,maintenance:maint,vat:vat,total:Math.round((base+vat)*100)/100};
}
function createQuotation(projectId,items,maintenance,number){
  var p=projectById(projectId);if(!p)return {error:"المشروع غير موجود."};
  items=(items||[]).filter(function(it){return String(it.name||"").trim()&&Number(it.qty)>0;});
  if(!items.length)return {error:"أضف بنداً واحداً على الأقل (صنف وكمية وسعر)."};
  number=String(number||"").trim()||nextSerial("quotation","Q");
  if(isSerialUsed("quotation",number))return {error:"رقم العرض «"+number+"» مستخدم من قبل — أدخل رقماً آخر."};
  var maint={included:!!(maintenance&&maintenance.included),type:String((maintenance&&maintenance.type)||"").trim(),amount:Number((maintenance&&maintenance.amount)||0)||0,duration:String((maintenance&&maintenance.duration)||"").trim()};
  var t=quoteTotals(items,maint.included?maint.amount:0);
  var q={id:uid("qt"),number:number,projectId:p.id,clientId:p.clientId,items:items.map(function(it){return {name:String(it.name).trim(),qty:Number(it.qty),price:Number(it.price),unit:String(it.unit||"").trim()};}),maintenance:maint,subtotal:t.subtotal,vat:t.vat,total:t.total,status:"draft",createdAt:nowISO(),updatedAt:nowISO()};
  state.quotations.push(q);
  p.status="quoted";p.updatedAt=nowISO();logAudit("create_quotation","إنشاء عرض سعر "+q.number+" للمشروع "+p.number+" — الإجمالي "+fmtM(q.total),q.number,"عروض الأسعار");save();return {quotation:q};
}
function sendQuotation(quotationId){
  var q=quoteById(quotationId);if(!q)return {error:"العرض غير موجود."};
  if(q.status!=="draft")return {error:"لا يمكن إرسال العرض — حالته الحالية «"+quoteStatusLabel(q.status)+"» وليست مسودة."};
  q.status="sent";q.sentAt=nowISO();q.updatedAt=nowISO();logAudit("send_quotation","إرسال عرض السعر "+q.number+" للعميل",q.number,"عروض الأسعار");save();return {quotation:q};
}
function clientResponse(quotationId,decision,note){
  var q=quoteById(quotationId);if(!q)return {error:"العرض غير موجود."};
  if(q.status!=="sent")return {error:"لا يمكن تسجيل رد العميل — العرض لم يُرسل له بعد (حالته «"+quoteStatusLabel(q.status)+"»)."};
  var p=projectById(q.projectId);
  if(decision==="accept"){
    q.status="client_accepted";q.clientResponseNote=String(note||"").trim();q.updatedAt=nowISO();
    if(p){p.status="client_accepted";p.updatedAt=nowISO();}
    logAudit("client_accept","قبول العميل لعرض السعر "+q.number,q.number,"عروض الأسعار");save();
    notifyRole("gm","عميل قبل عرض السعر "+q.number,"العميل "+(p?p.clientName:"")+" قبل العرض بقيمة "+fmtM(q.total)+" — يلزم التعميد الإلكتروني من المدير العام.",{quotationId:q.id,projectId:q.projectId});
    return {quotation:q};
  }
  q.status="cancelled";q.clientResponseNote=String(note||"").trim();q.updatedAt=nowISO();
  if(p){p.status="client_rejected";p.updatedAt=nowISO();}
  logAudit("client_reject","رفض العميل لعرض السعر "+q.number,q.number,"عروض الأسعار");save();return {quotation:q};
}
function gmApprove(quotationId){
  var q=quoteById(quotationId);if(!q)return {error:"العرض غير موجود."};
  if(q.status!=="client_accepted")return {error:"لا يمكن التعميد قبل قبول العميل للعرض."};
  var u=state.user;
  q.status="gm_approved";q.updatedAt=nowISO();
  state.approvals.push({id:uid("ap"),quotationId:q.id,projectId:q.projectId,decision:"approved",by:u?u.username:"—",name:u?u.fullName:"—",date:today(),createdAt:nowISO()});
  var p=projectById(q.projectId);if(p){p.status="gm_approved";p.updatedAt=nowISO();}
  q.items.forEach(function(it){state.material_issues.push({id:uid("mi"),quotationId:q.id,projectId:q.projectId,itemName:it.name,qtyOrdered:Number(it.qty),qtyIssued:0,issuedBy:null,date:null});});
  /* عقد الصيانة التلقائي: إن كان العرض يشمل عقد صيانة، يُنشأ سجل عقد
     فور التعميد برقم متسلسل وحالة prepared ومصدر maintenance، فيظهر
     في شاشة العقود دون انتظار تجهيز السكرتارية. العقد وثيقة فقط —
     لا ينشئ مديونية جديدة (المديونية هي إجمالي العرض عند الاعتماد
     المالي)، فلا ازدواج في الحسابات. */
  var maintContract=null;
  if(q.maintenance&&q.maintenance.included){
    var cn=nextSerial("contract","C");
    maintContract={id:uid("ct"),number:cn,quotationId:q.id,projectId:q.projectId,clientId:q.clientId,type:String(q.maintenance.type||"صيانة"),fileName:"",status:"prepared",source:"maintenance",amount:Number(q.maintenance.amount)||0,duration:String(q.maintenance.duration||""),preparedBy:u?u.username:"—",createdAt:nowISO()};
    state.contracts.push(maintContract);
    logAudit("create_maintenance_contract","إنشاء عقد صيانة تلقائي "+cn+" ("+maintContract.type+" — "+fmtM(maintContract.amount)+" — "+maintContract.duration+") لعرض السعر "+q.number,cn,"العقود");
  }
  logAudit("gm_approve","تعميد المدير العام لعرض السعر "+q.number+" — الإجمالي "+fmtM(q.total),q.number,"التعميد (المدير العام)");save();
  notifyRole("accounts","عرض معمّد — ابدأ صرف المواد "+q.number,"المدير العام عمّد العرض. اصرف المواد لكل بند من شاشة صرف المواد.",{quotationId:q.id,projectId:q.projectId});
  notifyRole("storekeeper","عرض معمّد — ابدأ صرف المواد "+q.number,"المدير العام عمّد العرض. اصرف المواد لكل بند من شاشة صرف المواد.",{quotationId:q.id,projectId:q.projectId});
  notifyRole("secretariat","عرض معمّد — جهّز العقد "+q.number,"المدير العام عمّد العرض. جهّز العقد من شاشة العقود.",{quotationId:q.id,projectId:q.projectId});
  return {quotation:q,maintenanceContract:maintContract};
}
function gmReject(quotationId,reason){
  var q=quoteById(quotationId);if(!q)return {error:"العرض غير موجود."};
  if(q.status!=="client_accepted")return {error:"لا يمكن رفض التعميد — العرض لم يقبله العميل بعد (حالته «"+quoteStatusLabel(q.status)+"»)."};
  reason=String(reason||"").trim();if(!reason)return {error:"رفض التعميد يتطلب سبباً — اكتبه."};
  var u=state.user;
  q.status="gm_rejected";q.gmRejectReason=reason;q.updatedAt=nowISO();
  state.approvals.push({id:uid("ap"),quotationId:q.id,projectId:q.projectId,decision:"rejected",reason:reason,by:u?u.username:"—",name:u?u.fullName:"—",date:today(),createdAt:nowISO()});
  var p=projectById(q.projectId);if(p){p.status="gm_rejected";p.updatedAt=nowISO();}
  logAudit("gm_reject","رفض تعميد عرض السعر "+q.number+" — السبب: "+reason,q.number,"التعميد (المدير العام)");save();
  notifyRole("projects_manager","رفض المدير العام تعميد العرض "+q.number,"السبب: "+reason+" — عاد العرض إليك للمراجعة.",{quotationId:q.id,projectId:q.projectId});
  return {quotation:q};
}
function issueMaterial(issueId,qty){
  var mi=null;for(var i=0;i<state.material_issues.length;i++)if(String(state.material_issues[i].id)===String(issueId))mi=state.material_issues[i];
  if(!mi)return {error:"بند الصرف غير موجود."};
  qty=Number(qty)||0;
  if(qty<=0)return {error:"أدخل كمية منصرفة أكبر من صفر."};
  var remaining=mi.qtyOrdered-mi.qtyIssued;
  if(qty>remaining)return {error:"الكمية المطلوبة ("+qty+") أكبر من المتبقي ("+remaining+") لهذا البند."};
  /* رصيد المخزون: إن كان البند مسجلاً صنفاً في شاشة الأصناف، لا يُصرف
     أكثر من الكمية المتاحة فيه، وتُخصم الكمية المنصرفة من رصيده فوراً.
     البنود غير المسجلة أصنافاً (نص حر في العرض) لا يقيّدها المخزون.
     (الفحص قبل أي تعديل حتى لا يتلوث الرصيد عند الرفض.) */
  var _it=itemByName(mi.itemName);
  if(_it&&qty>Number(_it.qty||0))return {error:"لا يمكن صرف "+qty+" من «"+mi.itemName+"» — الكمية المتاحة في المخزون "+Number(_it.qty||0)+" فقط."};
  mi.qtyIssued+=qty;mi.issuedBy=state.user?state.user.username:"—";mi.date=today();mi.updatedAt=nowISO();
  if(_it){_it.qty=Number(_it.qty||0)-qty;_it.updatedAt=nowISO();}
  var _iq=quoteById(mi.quotationId);logAudit("issue_material","صرف "+qty+" من "+mi.itemName+" لعرض السعر "+(_iq?_iq.number:"")+" (المنصرف الآن "+mi.qtyIssued+" من "+mi.qtyOrdered+")",_iq?_iq.number:"","صرف المواد");save();return {issue:mi};
}
function allMaterialsIssued(quotationId){
  var rows=state.material_issues.filter(function(m){return String(m.quotationId)===String(quotationId);});
  if(!rows.length)return false;
  return rows.every(function(m){return Number(m.qtyIssued)>=Number(m.qtyOrdered);});
}
function prepareContract(quotationId,type,fileName,number){
  var q=quoteById(quotationId);if(!q)return {error:"العرض غير موجود."};
  if(q.status!=="gm_approved"&&q.status!=="financial_approved")return {error:"لا يمكن تجهيز عقد — العرض لم يُعمَّد بعد (حالته «"+quoteStatusLabel(q.status)+"»)."};
  if(CONTRACT_TYPES.indexOf(type)<0)return {error:"اختر نوع العقد."};
  number=String(number||"").trim()||nextSerial("contract","C");
  if(isSerialUsed("contract",number))return {error:"رقم العقد «"+number+"» مستخدم من قبل — أدخل رقماً آخر."};
  var c={id:uid("ct"),number:number,quotationId:q.id,projectId:q.projectId,clientId:q.clientId,type:type,fileName:String(fileName||"").trim(),status:"prepared",preparedBy:state.user?state.user.username:"—",createdAt:nowISO()};
  state.contracts.push(c);
  var p=projectById(q.projectId);if(p&&p.status==="gm_approved"){p.status="contracted";p.updatedAt=nowISO();}
  logAudit("prepare_contract","تجهيز عقد "+c.type+" رقم "+c.number+" لعرض السعر "+q.number,c.number,"العقود");save();return {contract:c};
}
function financialApprove(quotationId){
  var q=quoteById(quotationId);if(!q)return {error:"العرض غير موجود."};
  if(q.status!=="gm_approved")return {error:"لا يمكن الاعتماد المالي قبل تعميد المدير العام."};
  if(!allMaterialsIssued(quotationId)){
    var rows=state.material_issues.filter(function(m){return String(m.quotationId)===String(quotationId);});
    var pending=rows.filter(function(m){return Number(m.qtyIssued)<Number(m.qtyOrdered);}).map(function(m){return m.itemName+" (منصرف "+m.qtyIssued+" من "+m.qtyOrdered+")";});
    return {error:"لا يمكن اعتماد العرض ولا تسجيل المديونية قبل اكتمال صرف كل المواد. المتبقي: "+pending.join("، ")+"."};
  }
  q.status="financial_approved";q.financialApprovedAt=nowISO();q.financialApprovedBy=state.user?state.user.username:"—";q.updatedAt=nowISO();
  var p=projectById(q.projectId);if(p){p.status="approved";p.updatedAt=nowISO();}
  logAudit("financial_approve","الاعتماد المالي لعرض السعر "+q.number+" — تسجيل مديونية "+fmtM(q.total)+" على العميل",q.number,"الاعتماد المالي والمديونيات");save();
  notifyRole("accounts","تم الاعتماد المالي للعرض "+q.number,"سُجلت المديونية على العميل بقيمة "+fmtM(q.total)+".",{quotationId:q.id,projectId:q.projectId});
  return {quotation:q};
}
function recordPayment(clientId,kind,amount,note,quotationId,skipAudit){
  var cl=clientById(clientId);if(!cl)return {error:"العميل غير موجود."};
  amount=Number(amount)||0;if(amount<=0)return {error:"أدخل مبلغاً أكبر من صفر."};
  if(kind!=="advance"&&kind!=="payment")kind="payment";
  var c=counters();c.payment=(Number(c.payment)||0)+1;
  var pay={id:uid("py"),docNo:"PY-"+String(c.payment).padStart(4,"0"),clientId:cl.id,quotationId:quotationId||null,kind:kind,amount:amount,note:String(note||"").trim(),date:today(),by:state.user?state.user.username:"—",createdAt:nowISO()};
  state.payments.push(pay);if(!skipAudit)logAudit("record_payment","تسجيل "+(kind==="advance"?"دفعة مقدمة":"دفعة سداد")+" "+pay.docNo+" بمبلغ "+fmtM(amount)+" من العميل "+cl.name,pay.docNo,"الاعتماد المالي والمديونيات");save();return {payment:pay};
}
function setOpeningBalance(clientId,amount){
  var cl=clientById(clientId);if(!cl)return {error:"العميل غير موجود."};
  cl.openingBalance=Number(amount)||0;cl.updatedAt=nowISO();logAudit("set_opening","تعديل الرصيد الافتتاحي للعميل "+cl.name+" إلى "+fmtM(Number(amount)||0),"","التقارير — ميزان المراجعة");save();return {client:cl};
}
/* ---------- مرتجع المواد ---------- */
function returnsForQuotation(qid){return state.material_returns.filter(function(r){return String(r.quotationId)===String(qid);});}
function returnsTotalForQuotation(qid){var t=0;returnsForQuotation(qid).forEach(function(r){t+=Number(r.amount)||0;});return Math.round(t*100)/100;}
function returnedQtyForItem(qid,itemName){var q=0;returnsForQuotation(qid).forEach(function(r){if(String(r.itemName)===String(itemName))q+=Number(r.qty)||0;});return q;}
function quoteItemPrice(q,itemName){if(!q||!q.items)return 0;for(var i=0;i<q.items.length;i++)if(String(q.items[i].name)===String(itemName))return Number(q.items[i].price)||0;return 0;}
/* مرتجع مواد منصرفة: يُسمح فقط للعروض المعتمدة مالياً (التي سُجلت مديونيتها).
   الكمية المرتجعة لا تتجاوز المنصرف منها مطروحاً منه ما سبق إرجاعه، وقيمتها
   تُحسب بسعر الوحدة في العرض، وتُخصم من مديونية العميل في ميزان المراجعة
   وكشف الحساب التحليلي، وتظهر في العرض نفسه. */
function createMaterialReturn(quotationId,itemName,qty,note){
  var q=quoteById(quotationId);if(!q)return {error:"العرض غير موجود."};
  if(q.status!=="financial_approved")return {error:"المرتجع متاح فقط للعروض المعتمدة مالياً (التي سُجلت مديونيتها)."};
  itemName=String(itemName||"").trim();qty=Number(qty)||0;
  if(!itemName)return {error:"اختر المادة."};
  if(qty<=0)return {error:"أدخل كمية مرتجعة أكبر من صفر."};
  var issued=0;state.material_issues.forEach(function(m){if(String(m.quotationId)===String(quotationId)&&String(m.itemName)===String(itemName))issued+=Number(m.qtyIssued)||0;});
  var max=issued-returnedQtyForItem(quotationId,itemName);
  if(qty>max)return {error:"الكمية المرتجعة ("+qty+") أكبر من الكمية القابلة للإرجاع ("+max+") لهذه المادة."};
  var price=quoteItemPrice(q,itemName);
  var c=counters();c["return"]=(Number(c["return"])||0)+1;
  var ret={id:uid("mr"),docNo:"MR-"+String(c["return"]).padStart(4,"0"),quotationId:q.id,projectId:q.projectId,clientId:q.clientId,itemName:itemName,qty:qty,unitPrice:price,amount:Math.round(qty*price*100)/100,date:today(),by:state.user?state.user.username:"—",note:String(note||"").trim(),createdAt:nowISO()};
  state.material_returns.push(ret);
  /* المرتجع يعيد الكمية إلى رصيد الصنف في المخزون إن كان مسجلاً. */
  var _rit=itemByName(itemName);
  if(_rit){_rit.qty=Number(_rit.qty||0)+qty;_rit.updatedAt=nowISO();}
  logAudit("create_return","مرتجع مواد "+ret.docNo+": "+itemName+" ×"+qty+" بقيمة "+fmtM(ret.amount)+" — تخفيض مديونية العميل",ret.docNo,"مرتجع المواد");save();return {ret:ret};
}
/* ---------- إدارة الحسابات: الإيرادات والمصروفات والحركات ---------- */
function materialCostTotal(){
  var t=0;
  state.material_issues.forEach(function(m){
    var q=quoteById(m.quotationId);if(!q||q.status!=="financial_approved")return;
    t+=(Number(m.qtyIssued)||0)*quoteItemPrice(q,m.itemName);
  });
  return Math.round(t*100)/100;
}
/* الإيراد المسجل من عميل يُحفظ أيضاً كدفعة في payments (paymentDocNo)،
   فيُحسب مرة واحدة فقط هنا وفي كل التجميعات — يُستثنى من تكرار الحساب. */
function isCountedRevenue(tr){return tr.kind==="revenue"&&tr.paymentDocNo;}
function revenueTotal(){
  var t=0;state.payments.forEach(function(p){t+=Number(p.amount)||0;});
  state.transactions.forEach(function(tr){if(tr.kind==="revenue"&&!isCountedRevenue(tr))t+=Number(tr.amount)||0;});
  return Math.round(t*100)/100;
}
function expenseTotal(){
  var t=materialCostTotal();
  state.transactions.forEach(function(tr){if(tr.kind==="expense")t+=Number(tr.amount)||0;});
  return Math.round(t*100)/100;
}
function bankBalanceCalc(){
  var s=state.settings[0]||{};
  var b=Number(s.bankBalance)||0;
  state.transactions.forEach(function(tr){if(tr.method==="بنك"&&!isCountedRevenue(tr)){if(tr.kind==="revenue")b+=Number(tr.amount)||0;else b-=Number(tr.amount)||0;}});
  return Math.round(b*100)/100;
}
function safeBalanceCalc(){
  var s=state.settings[0]||{};
  var b=Number(s.safeBalance)||0;
  state.payments.forEach(function(p){b+=Number(p.amount)||0;});
  state.transactions.forEach(function(tr){if(tr.method!=="بنك"&&!isCountedRevenue(tr)){if(tr.kind==="revenue")b+=Number(tr.amount)||0;else b-=Number(tr.amount)||0;}});
  b-=materialCostTotal();
  return Math.round(b*100)/100;
}
/* تسجيل إيراد/مصروف. الإيراد المرتبط بعميل يُسجَّل أيضاً دفعة سداد على
   العميل فينعكس في ميزان المراجعة وكشف حسابه (تخفيض مديونيته). */
function recordTransaction(kind,amount,category,method,description,clientId){
  amount=Number(amount)||0;
  if(kind!=="revenue"&&kind!=="expense")return {error:"نوع الحركة غير صحيح."};
  if(amount<=0)return {error:"أدخل مبلغاً أكبر من صفر."};
  var c=counters();c.transaction=(Number(c.transaction)||0)+1;
  var tr={id:uid("tr"),docNo:"TR-"+String(c.transaction).padStart(4,"0"),kind:kind,amount:amount,category:String(category||"").trim()||(kind==="revenue"?"إيراد":"مصروف"),method:method==="بنك"?"بنك":"نقدي",description:String(description||"").trim(),clientId:clientId||null,date:today(),by:state.user?state.user.username:"—",createdAt:nowISO()};
  state.transactions.push(tr);
  if(kind==="revenue"&&clientId){
    var pr=recordPayment(clientId,"payment",amount,description||"إيراد مسجل من إدارة الحسابات",null,true);
    if(pr.error){state.transactions.pop();return pr;}
    tr.paymentDocNo=pr.payment.docNo;
  }
  logAudit("record_transaction","تسجيل "+(kind==="revenue"?"إيراد":"مصروف")+" "+tr.docNo+" بمبلغ "+fmtM(amount)+" — "+tr.category,tr.docNo,"إدارة الحسابات");save();return {transaction:tr};
}
function accountMovements(){
  var moves=[];
  state.payments.forEach(function(p){moves.push({date:p.date,doc:p.docNo,desc:"دفعة من العميل "+((clientById(p.clientId)||{}).name||"")+(p.note?" — "+p.note:""),category:p.kind==="advance"?"دفعة مقدمة":"دفعة سداد",method:"نقدي",kind:"revenue",amount:Number(p.amount)||0});});
  state.material_issues.forEach(function(m){
    var q=quoteById(m.quotationId);if(!q||q.status!=="financial_approved")return;
    var qty=Number(m.qtyIssued)||0;if(qty<=0)return;
    moves.push({date:m.date||String(q.financialApprovedAt||"").slice(0,10),doc:q.number,desc:"تكلفة مواد منصرفة — "+m.itemName,category:"مواد",method:"نقدي",kind:"expense",amount:Math.round(qty*quoteItemPrice(q,m.itemName)*100)/100});
  });
  state.transactions.forEach(function(tr){
    if(isCountedRevenue(tr))return;
    moves.push({date:tr.date,doc:tr.docNo,desc:tr.description||tr.category,category:tr.category,method:tr.method,kind:tr.kind,amount:Number(tr.amount)||0});
  });
  state.material_returns.forEach(function(r){moves.push({date:r.date,doc:r.docNo,desc:"مرتجع مواد — "+r.itemName+" ×"+r.qty+" (تخفيض مديونية "+fmtM(r.amount)+")",category:"مرتجع مواد",method:"—",kind:"return",amount:Number(r.amount)||0});});
  moves.sort(function(a,b){return String(b.date).localeCompare(String(a.date));});
  return moves;
}
function monthKey(d){return String(d||"").slice(0,7);}
function monthLabel(ym){var parts=String(ym).split("-");var months=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];var m=Number(parts[1]);return (months[m-1]||"")+" "+(parts[0]||"");}
function accMonthly(){
  var map={};
  function add(ym,rev,exp){if(!ym||ym.length<7)return;if(!map[ym])map[ym]={rev:0,exp:0};map[ym].rev+=rev;map[ym].exp+=exp;}
  state.payments.forEach(function(p){add(monthKey(p.date),Number(p.amount)||0,0);});
  state.transactions.forEach(function(tr){if(isCountedRevenue(tr))return;if(tr.kind==="revenue")add(monthKey(tr.date),Number(tr.amount)||0,0);else add(monthKey(tr.date),0,Number(tr.amount)||0);});
  state.material_issues.forEach(function(m){var q=quoteById(m.quotationId);if(!q||q.status!=="financial_approved")return;var qty=Number(m.qtyIssued)||0;if(qty>0)add(monthKey(m.date||String(q.financialApprovedAt||"").slice(0,10)),0,qty*quoteItemPrice(q,m.itemName));});
  var keys=Object.keys(map).sort();
  return keys.map(function(k){return {ym:k,label:monthLabel(k),rev:Math.round(map[k].rev*100)/100,exp:Math.round(map[k].exp*100)/100,net:Math.round((map[k].rev-map[k].exp)*100)/100};});
}
function expenseBreakdown(){
  var cats={};
  var mat=materialCostTotal();if(mat>0)cats["مواد منصرفة"]=mat;
  state.transactions.forEach(function(tr){if(tr.kind==="expense"){var c2=tr.category||"مصروفات أخرى";cats[c2]=((cats[c2]||0)+Number(tr.amount)||0);}});
  var total=0;Object.keys(cats).forEach(function(k){total+=cats[k];});
  var rows=Object.keys(cats).map(function(k){return {name:k,amount:Math.round(cats[k]*100)/100,pct:total>0?Math.round(cats[k]/total*1000)/10:0};});
  rows.sort(function(a,b){return b.amount-a.amount;});
  return {rows:rows,total:Math.round(total*100)/100};
}

  if(fields.taxNumber!==undefined)s.taxNumber=String(fields.taxNumber);
  if(fields.city!==undefined)s.city=String(fields.city);

}
/* ---------- الطباعة والتصدير ---------- */
function printHtml(html){
  var area=document.getElementById("printArea");
  if(!area){area=document.createElement("div");area.id="printArea";document.body.appendChild(area);}
  area.innerHTML=html;
  if(typeof window!=="undefined"&&typeof window.print==="function"){try{window.print();}catch(e){}}
  return area.innerHTML;
}
/* ---------- الطباعة على الترويسة الرسمية ---------- */
/* تقسيم صفوف الجدول على صفحات A4: كل صفحة ترويسة كاملة، ورأس الجدول
   يتكرر في كل صفحة، والصفوف لا تنقسم، والتذييل (الإجماليات/التواقيع)
   يبقى معاً في الصفحة الأخيرة — تُحجز له مساحة بإنقاص صفوف الصفحة الأخيرة. */
function paginateRows(rows,perPage,footRows){
  var pages=[];var cur=[];
  rows.forEach(function(r){cur.push(r);if(cur.length>=perPage){pages.push(cur);cur=[];}});
  if(cur.length)pages.push(cur);
  if(!pages.length)pages.push([]);
  if(footRows&&pages.length){
    var last=pages[pages.length-1];
    if(last.length>perPage-footRows){var mv=last.splice(perPage-footRows);pages.push(mv);}
  }
  return pages;
}
function letterheadPage(inner,pageNo,totalPages,continued,dense){
  var h='<div class="print-page"><div class="print-content'+(dense?" dense":"")+'">';
  if(pageNo>1&&continued)h+='<p class="cont-line">'+esc(continued)+' — صفحة '+pageNo+' من '+totalPages+'</p>';
  h+=inner+'</div></div>';
  return h;
}
/* أعمدة عرض السعر كما في النموذج: الرقم، بيان الأعمال (50% — الأهم)،
   الوحدة، الكمية، السعر الإفرادي 12%، السعر الإجمالي 13%.
   كثافة الصفوف حسب عدد البنود: حتى 17 بنداً كثافة عادية، وأكثر من
   ذلك كثافة عالية (36 صفاً في الصفحة) كما في نمط KMA. */
function quotePrintHtml(q){
  var p=projectById(q.projectId);var cl=clientById(q.clientId);

/* تطبيع رقم الجوال السعودي لروابط wa.me: حذف غير الأرقام، وتحويل
   الصفر الأولى إلى 966 للرقم المكوّن من 10 أرقام. */
function normalizePhone(raw){
  var phone=String(raw||"").replace(/[^0-9]/g,"");
  if(phone.length===10&&phone.charAt(0)==="0")phone="966"+phone.slice(1);
  return phone;
}
function waLinkForQuote(qid){
  var q=quoteById(qid);if(!q)return null;
  var cl=clientById(q.clientId);var phone=normalizePhone(cl?cl.phone||"":"");
  if(!phone)return {error:"رقم جوال العميل غير مسجل."};
  var p=projectById(q.projectId);
  var items=q.items.map(function(it){return it.name+" ×"+it.qty;}).join("، ");
  var msg="السلام عليكم، عرض السعر رقم "+q.number+" — المشروع: "+(p?p.title:"")+" — المواد: "+items+" — الإجمالي شامل الضريبة: "+fmtM(q.total)+" "+((state.settings[0]||{}).currency||"ر.س");
  return {url:"https://wa.me/"+phone+"?text="+encodeURIComponent(msg),phone:phone};
}
var SITE_URL="https://kma-system.vercel.app";
/* رابط واتساب الفني المُسند: إشعار مختصر فقط بوجود مهمة جديدة —
   الفني يدخل النظام بيوزره الخاص لعرض المهام واعتمادها من داخل
   النظام. لا تُرسل تفاصيل المهمة (العنوان واسم العميل ورقمه والعمل
   المطلوب) عبر واتساب إطلاقاً؛ التفاصيل الكاملة تبقى داخل النظام
   فقط بعد تسجيل دخول الفني. الإرسال نفسه يتم بفتح wa.me من
   متصفح المدير (ليس إرسالاً تلقائياً من الخادم) — واتساب لا يوفّر
   إرسالاً من الخادم بلا مزوّد رسمي مدفوع. */
function buildTechnicianWhatsApp(projectId,technicianId){
  var p=projectById(projectId);if(!p)return {error:"المشروع غير موجود."};
  var t=userById(technicianId);if(!t)return {error:"الفني غير موجود."};
  var phone=normalizePhone(t.phone);
  if(!phone)return {error:"رقم جوال الفني «"+(t.fullName||t.username)+"» غير مسجل — سجّله من شاشة المستخدمين أولاً."};
  var msg="لديك مهمة جديدة في نظام إدارة مشاريع المقاولات — سجّل دخولك بيوزرك لعرض المهام واعتمادها\n"+SITE_URL;
  return {url:"https://wa.me/"+phone+"?text="+encodeURIComponent(msg),phone:phone,technicianId:t.id,projectId:p.id};
}
function sendTechnicianWhatsApp(projectId,technicianId){
  var r=buildTechnicianWhatsApp(projectId,technicianId);
  if(!r||r.error)return r||{error:"تعذّر بناء رابط الواتساب."};
  var t=userById(technicianId),p=projectById(projectId);
  logAudit("assign_whatsapp","إرسال واتساب للفني "+(t?t.fullName||t.username:"")+" — المشروع "+(p?p.number:""),"","إدارة المشاريع");
  save();
  if(typeof window!=="undefined"&&window.open){try{window.open(r.url,"_blank");}catch(e){}}
  return r;
}
function sendQuoteWhatsApp(qid){
  var r=waLinkForQuote(qid);
  if(!r)return {error:"العرض غير موجود."};
  if(r.error)return r;
  if(typeof window!=="undefined"&&window.open){try{window.open(r.url,"_blank");}catch(e){}}
  return r;
}
function downloadTextFile(filename,content,type){
  try{
    var blob=new Blob([content],{type:type||"text/plain;charset=utf-8"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(function(){try{URL.revokeObjectURL(a.href);a.remove();}catch(e){}},500);
    return true;
  }catch(e){return false;}
}

function auditFilters(){
  if(!state.ui.auditFilters)state.ui.auditFilters={user:"",action:"",from:"",to:"",q:""};
  return state.ui.auditFilters;
}
function filterAudit(){
  var f=auditFilters();
  var rows=(state.audit_log||[]).slice().sort(function(a,b){return String(b.at||"").localeCompare(String(a.at||""));});
  return rows.filter(function(e){
    if(f.user&&String(e.username)!==String(f.user))return false;
    if(f.action&&e.action!==f.action)return false;
    if(f.from&&String(e.at||"").slice(0,10)<f.from)return false;
    if(f.to&&String(e.at||"").slice(0,10)>f.to)return false;
    if(f.q){var s=(e.summary||"")+" "+(e.docNo||"")+" "+(e.username||"")+" "+(e.fullName||"")+" "+auditActionLabel(e.action);if(s.indexOf(f.q)<0)return false;}
    return true;
  });
}
function applyAuditFilters(){
  var f=auditFilters();
  f.user=$("afUser")?$("afUser").value:"";
  f.action=$("afAction")?$("afAction").value:"";
  f.from=$("afFrom")?$("afFrom").value:"";
  f.to=$("afTo")?$("afTo").value:"";
  f.q=$("afQ")?$("afQ").value.trim():"";
  render();
}
function clearAuditFilters(){state.ui.auditFilters={user:"",action:"",from:"",to:"",q:""};render();}
function auditUsers(){
  var seen={};var out=[];
  (state.audit_log||[]).forEach(function(e){var k=String(e.username||"");if(k&&!seen[k]){seen[k]=1;out.push({username:k,fullName:e.fullName||k});}});
  return out;
}

/* ميزان مراجعة بحسابات العملاء: افتتاحي + مدين (مديونيات معتمدة) + دائن
   (دفعات) + ختامي لكل عميل، مع صف إجمالي كلي. */
function trialBalance(){
  var rows=state.clients.map(function(cl){
    var debit=0;state.quotations.forEach(function(q){if(String(q.clientId)===String(cl.id)&&q.status==="financial_approved")debit+=(Number(q.total)||0)-returnsTotalForQuotation(q.id);});
    var credit=0;state.payments.forEach(function(p){if(String(p.clientId)===String(cl.id))credit+=Number(p.amount)||0;});
    var opening=Number(cl.openingBalance)||0;
    return {client:cl,opening:opening,debit:debit,credit:credit,closing:opening+debit-credit};
  });
  var tot={opening:0,debit:0,credit:0,closing:0};
  rows.forEach(function(r){tot.opening+=r.opening;tot.debit+=r.debit;tot.credit+=r.credit;tot.closing+=r.closing;});
  return {rows:rows,total:tot};
}
function clientStatement(clientId){
  var cl=clientById(clientId);if(!cl)return null;
  var moves=[{date:cl.createdAt?String(cl.createdAt).slice(0,10):today(),doc:"رصيد افتتاحي",desc:"رصيد افتتاحي",debit:Number(cl.openingBalance)||0,credit:0}];
  state.quotations.forEach(function(q){
    if(String(q.clientId)===String(clientId)&&q.status==="financial_approved")
      moves.push({date:String(q.financialApprovedAt||q.updatedAt||"").slice(0,10),doc:q.number,desc:"مديونية — عرض سعر "+q.number, debit:Number(q.total)||0,credit:0});
  });
  state.payments.forEach(function(p){
    if(String(p.clientId)===String(clientId))
      moves.push({date:p.date,doc:p.docNo,desc:(p.kind==="advance"?"دفعة مقدمة":"دفعة سداد")+(p.note?" — "+p.note:""),debit:0,credit:Number(p.amount)||0});
  });
  state.material_returns.forEach(function(r){
    if(String(r.clientId)===String(clientId))
      moves.push({date:r.date,doc:r.docNo,desc:"مرتجع مواد — "+r.itemName+" ×"+r.qty, debit:0,credit:Number(r.amount)||0});
  });
  moves.sort(function(a,b){return String(a.date).localeCompare(String(b.date));});
  var bal=0;moves.forEach(function(m){bal+=m.debit-m.credit;m.balance=bal;});
  return {client:cl,moves:moves,finalBalance:bal};
}

/* ---------- الأصناف ---------- */
/* سجل الصنف: {id, code, name, unit, salePrice, costPrice, qty, createdAt, updatedAt}.
   الكود تلقائي متسلسل ITM-0001 ولا يتكرر أبداً (nextSerial + فحص isSerialUsed).
   qty هو رصيد المخزون الحالي: يُخصم عند صرف المواد ويُعاد عند المرتجع. */
function itemById(id){for(var i=0;i<state.items.length;i++)if(String(state.items[i].id)===String(id))return state.items[i];return null;}
function itemByCode(code){code=String(code||"").trim();if(!code)return null;for(var i=0;i<state.items.length;i++)if(String(state.items[i].code)===String(code))return state.items[i];return null;}
function itemByName(name){name=String(name||"").trim();if(!name)return null;for(var i=0;i<state.items.length;i++)if(String(state.items[i].name).trim()===name)return state.items[i];return null;}
function searchItems(q){
  q=String(q||"").trim();
  if(!q)return state.items.slice();
  return state.items.filter(function(it){return String(it.name||"").indexOf(q)>=0||String(it.code||"").indexOf(q)>=0;});
}
/* هل على الصنف أي حركة؟ الاسم في أي بند عرض سعر، أو في صرف مواد، أو في مرتجع مواد.
   الحركة تمنع الحذف نهائياً (حماية مثل حماية حذف المشروع) ويبقى التعديل مسموحاً. */
function itemHasMovements(item){
  var name=String(item.name||"").trim();
  if(!name)return false;
  for(var i=0;i<state.quotations.length;i++){var q=state.quotations[i];for(var j=0;j<(q.items||[]).length;j++)if(String(q.items[j].name).trim()===name)return true;}
  for(var k=0;k<state.material_issues.length;k++)if(String(state.material_issues[k].itemName).trim()===name)return true;
  for(var m=0;m<state.material_returns.length;m++)if(String(state.material_returns[m].itemName).trim()===name)return true;
  return false;
}
function createItem(code,name,unit,salePrice,costPrice,qty){
  name=String(name||"").trim();if(!name)return {error:"اسم الصنف مطلوب."};
  code=String(code||"").trim()||nextSerial("item","ITM");
  if(itemByCode(code))return {error:"كود الصنف «"+code+"» مستخدم من قبل — أدخل كوداً آخر."};
  var it={id:uid("it"),code:code,name:name,unit:String(unit||"").trim(),salePrice:Number(salePrice)||0,costPrice:Number(costPrice)||0,qty:Number(qty)||0,createdAt:nowISO(),updatedAt:nowISO()};
  state.items.push(it);logAudit("create_item","إنشاء صنف جديد: "+it.code+" — "+it.name+" (سعر البيع "+fmtM(it.salePrice)+" — الكمية "+it.qty+")",it.code,"الأصناف");save();return {item:it};
}
function updateItem(itemId,fields){
  var it=itemById(itemId);if(!it)return {error:"الصنف غير موجود."};
  if(fields.name!==undefined&&String(fields.name).trim())it.name=String(fields.name).trim();
  if(fields.code!==undefined){var nc=String(fields.code).trim();if(nc&&nc!==it.code&&itemByCode(nc))return {error:"كود الصنف «"+nc+"» مستخدم من قبل."};if(nc)it.code=nc;}
  if(fields.unit!==undefined)it.unit=String(fields.unit||"").trim();
  if(fields.salePrice!==undefined)it.salePrice=Number(fields.salePrice)||0;
  if(fields.costPrice!==undefined)it.costPrice=Number(fields.costPrice)||0;
  if(fields.qty!==undefined)it.qty=Number(fields.qty)||0;
  it.updatedAt=nowISO();
  logAudit("update_item","تعديل الصنف "+it.code+" — "+it.name,it.code,"الأصناف");save();return {item:it};
}
function deleteItem(itemId){
  var it=itemById(itemId);if(!it)return {error:"الصنف غير موجود."};
  if(itemHasMovements(it))return {error:"لا يمكن حذف الصنف «"+it.name+"» — توجد عليه حركات (بنود عروض أسعار أو صرف/مرتجع مواد). التعديل مسموح أما الحذف فممنوع."};
  state.items=state.items.filter(function(x){return String(x.id)!==String(itemId);});
  logAudit("delete_item","حذف الصنف "+it.code+" — "+it.name,it.code,"الأصناف");save();return {ok:true};
}
/* ---------- الأصناف — استيراد وتصدير CSV (Excel) ---------- */
function parseCSVLine(line){
  var out=[],cur="",inq=false;
  for(var i=0;i<line.length;i++){var ch=line[i];
    if(inq){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else inq=false;}else cur+=ch;}
    else if(ch==='"')inq=true;
    else if(ch===','){out.push(cur);cur="";}
    else cur+=ch;}
  out.push(cur);return out;
}
function toCSV(rows){
  return "\uFEFF"+rows.map(function(r){return r.map(function(c){return '"'+String(c==null?"":c).replace(/"/g,'""')+'"';}).join(",");}).join("\r\n");
}
function importItemsCSV(text){
  var t=String(text||"").replace(/^\uFEFF/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  var lines=t.split("\n");
  var imported=0,duplicated=0,rejected=0;
  lines.forEach(function(line){
    if(!String(line).trim())return;
    var cells=parseCSVLine(line);
    var code=String(cells[0]||"").trim();
    var name=String(cells[1]||"").trim();
    if(!code&&!name)return;
    var lc0=code.toLowerCase(),lc1=name.toLowerCase();
    if(lc0==="الكود"||lc0==="code"||lc1==="الاسم"||lc1==="name")return; /* صف الترويسة */
    if(!name){rejected++;return;}
    if(code&&itemByCode(code)){duplicated++;return;}
    var r=createItem(code,name,String(cells[2]||"").trim(),cells[3],cells[4],cells[5]);
    if(r.error){if(r.error.indexOf("مستخدم من قبل")>=0)duplicated++;else rejected++;}
    else imported++;
  });
  logAudit("import_items","استيراد أصناف من ملف Excel (CSV): مستورد "+imported+" — مكرر "+duplicated+" — مرفوض "+rejected,"","الأصناف");
  save();
  return {imported:imported,duplicated:duplicated,rejected:rejected};
}
function buildItemsCSV(){
  var rows=[["الأصناف"],["الكود","الاسم","الوحدة","سعر البيع","سعر التكلفة","الكمية"]];
  state.items.forEach(function(it){rows.push([it.code,it.name,it.unit||"",Number(it.salePrice||0).toFixed(2),Number(it.costPrice||0).toFixed(2),String(it.qty||0)]);});
  return toCSV(rows);
}
function exportItemsCSV(){
  downloadTextFile("items.csv",buildItemsCSV(),"text/csv;charset=utf-8");
  logAudit("export_items","تصدير الأصناف إلى ملف Excel (CSV) — "+state.items.length+" صنفاً","","الأصناف");save();return true;
}
function createUser(username,password,fullName,role,phone,permissions){
  username=String(username||"").trim();password=String(password||"");
  if(!username||!password)return {error:"اسم المستخدم وكلمة المرور مطلوبان."};
  if(!ROLES[role])return {error:"اختر دوراً صحيحاً."};
  if(findLocalUser(username))return {error:"اسم المستخدم «"+username+"» موجود من قبل."};
  var u={id:uid("u"),username:username,password:password,fullName:String(fullName||"").trim()||username,role:role,phone:String(phone||"").trim(),permissions:Array.isArray(permissions)?permissions.slice():(ROLE_SCREENS[role]||[]).slice(),companyId:COMPANY_ID,active:true,createdAt:nowISO()};
  state.users.push(u);logAudit("create_user","إنشاء مستخدم جديد: "+u.username+" ("+u.fullName+") — الدور: "+roleName(u.role),u.username,"المستخدمون");save();return {user:u};
}
function updateUser(userId,fields){
  var u=userById(userId);if(!u)return {error:"المستخدم غير موجود."};
  if(fields.username&&String(fields.username).trim()!==u.username&&findLocalUser(fields.username))return {error:"اسم المستخدم الجديد موجود من قبل."};
  if(fields.username)u.username=String(fields.username).trim();
  if(fields.fullName!==undefined)u.fullName=String(fields.fullName).trim();
  if(fields.role&&ROLES[fields.role])u.role=fields.role;
  if(fields.password)u.password=String(fields.password);
  if(fields.active!==undefined)u.active=!!fields.active;
  if(fields.phone!==undefined)u.phone=String(fields.phone||"").trim();
  if(fields.permissions!==undefined){
    if(Array.isArray(fields.permissions)){
      var oldPerms=Array.isArray(u.permissions)?u.permissions.slice():null;
      u.permissions=fields.permissions.slice();
      if(JSON.stringify(oldPerms)!==JSON.stringify(u.permissions))logAudit("update_permissions","تغيير صلاحيات المستخدم "+u.username+" — الشاشات المسموحة الآن: "+u.permissions.map(function(s){return SCREEN_TITLES[s]||s;}).join("، "),u.username,"المستخدمون");
    }else if(fields.permissions===null)u.permissions=null;
  }
  logAudit("update_user","تعديل المستخدم "+u.username+" ("+u.fullName+")",u.username,"المستخدمون");save();return {user:u};
}
function deleteUser(userId){
  var u=userById(userId);if(!u)return {error:"المستخدم غير موجود."};
  if(u.username==="1")return {error:"لا يمكن حذف المدير العام."};
  if(state.assignments.some(function(a){return String(a.technicianId)===String(userId);}))return {error:"لا يمكن حذف هذا المستخدم — لديه مهام مسندة."};
  state.users=state.users.filter(function(x){return String(x.id)!==String(userId);});
  logAudit("delete_user","حذف المستخدم "+u.username+" ("+u.fullName+")",u.username,"المستخدمون");save();return {ok:true};
}

<script>
/* ---------- شاشة مهامي (الفني — تعمل على الجوال) ---------- */
function screenTasks(){
  var u=state.user;

    h+='<div class="card" style="border:1px solid var(--gold)"><h3>'+esc(p.number)+' — '+esc(p.title)+'</h3>'+

    '<p><b>العنوان:</b> '+esc(p.address)+'</p>'+
    '<p><b>العمل المطلوب:</b> '+esc(p.description||p.type)+'</p>'+
    '<p><b>الحالة:</b> '+statusBadge(p.status,"project")+'</p>'+
    '<div class="row">'+
    (phone?'<a class="btn btn-navy btn-sm" href="tel:'+esc(phone)+'">📞 اتصال بالعميل</a>':"")+
    (waPhone?'<a class="btn btn-green btn-sm" target="_blank" rel="noopener" href="https://wa.me/'+esc(waPhone)+'">واتساب</a>':"")+
    '<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.address||"")+'">🗺 خريطة الموقع</a>'+
    (a.status==="pending"?'<button type="button" class="btn btn-gold btn-sm" onclick="doConfirmReceipt(\''+a.id+'\')">اعتماد المهمة</button>':'<span class="badge b-accepted">معتمدة من الفني ✓'+(a.acceptedAt?' — '+fmtDateTime(a.acceptedAt):"")+'</span>')+
    '</div>'+
    '<h3>معاينة الموقع — صور وفيديو</h3>'+
    '<p class="warn">الصور تُحفظ داخل النظام. أما الفيديو: <b>الفيديو الكبير لا يُحفظ داخل ملف البيانات (JSON)</b> — يُسجَّل اسم الملف وحجمه وملاحظتك فقط، ويُحفظ الفيديو نفسه خارج النظام (أرسله للمدير عبر واتساب مثلاً إن كان كبيراً). الصور الكبيرة جداً (فوق 3 ميغابايت) قد تفشل في الحفظ — صغّر الصورة قبل الرفع.</p>'+
    '<div class="row"><label class="btn btn-ghost btn-sm" style="cursor:pointer">📷 رفع صورة<input type="file" accept="image/*" class="hidden" onchange="handleMediaFile(\''+p.id+'\',this,\'photo\')"></label>'+
    '<label class="btn btn-ghost btn-sm" style="cursor:pointer">🎬 تسجيل فيديو (ملف مرفق بالاسم والحجم)<input type="file" accept="video/*" class="hidden" onchange="handleMediaFile(\''+p.id+'\',this,\'video\')"></label></div>'+
    '<div style="margin-top:.5rem"><label>ملاحظة على الوسائط</label><input id="mediaNote-'+p.id+'" class="inp" placeholder="ملاحظة (اختياري)"></div>'+
    (media.length?'<div style="margin-top:.5rem">'+media.map(function(m){
      if(m.kind==="photo"&&m.dataUrl)return '<div class="media-item"><img class="thumb" src="'+m.dataUrl+'" alt=""><div>'+esc(m.name)+'</div><div class="muted">'+esc(m.note||"")+'</div></div>';
      return '<div class="media-item"><div class="thumb" style="display:flex;align-items:center;justify-content:center">🎬 فيديو</div><div>'+esc(m.name)+'</div><div class="muted">'+(m.size?Math.round(m.size/1024)+" KB — ":"")+esc(m.note||"")+'</div></div>';
    }).join("")+'</div>':"")+
    '<div class="row" style="margin-top:.6rem"><button type="button" class="btn btn-navy" onclick="doSubmitInspection(\''+p.id+'\')">إرسال تقرير المعاينة لمدير المشاريع</button></div>'+
    '</div>';
  });

function doConfirmReceipt(aid){var r=confirmReceipt(aid);if(r.error){alert(r.error);return;}render();}
function doSubmitInspection(pid){var r=submitInspection(pid);if(r.error){alert(r.error);return;}render();var m=$("taskMsg");if(m)m.innerHTML='<div class="okbox">تم إرسال تقرير المعاينة لمدير المشاريع.</div>';}
function handleMediaFile(pid,input,kind){
  var f=input&&input.files&&input.files[0];if(!f)return;
  var noteEl=$("mediaNote-"+pid);var note=noteEl?noteEl.value:"";
  if(kind==="video"){
    var r=addMedia(pid,"video",f.name,f.size,null,note);
    if(r.error){alert(r.error);return;}
    render();var m=$("taskMsg");if(m)m.innerHTML='<div class="okbox">سُجّل الفيديو «'+esc(f.name)+'» بالاسم والحجم ('+Math.round(f.size/1024)+' KB) مع الملاحظة — الفيديو نفسه غير محفوظ داخل ملف البيانات.</div>';
    return;
  }
  if(f.size>3*1024*1024){alert("الصورة أكبر من 3 ميغابايت — صغّرها قبل الرفع حتى تُحفظ داخل النظام.");input.value="";return;}
  if(typeof FileReader==="undefined"){alert("متصفحك لا يدعم قراءة الملفات.");return;}
  var rd=new FileReader();
  rd.onload=function(){
    var r2=addMedia(pid,"photo",f.name,f.size,String(rd.result||""),note);
    if(r2.error){alert(r2.error);return;}
    render();
  };
  rd.onerror=function(){alert("تعذّرت قراءة الصورة.");};
  rd.readAsDataURL(f);
}
/* ---------- نافذة اختيار الأصناف (F9) والإكمال التلقائي ----------
   تُستخدم في شاشة الأصناف وفي حقل اسم الصنف ببنود عروض الأسعار.
   target: {kind:"form"} لنموذج الأصناف، أو {kind:"quote",line:i} لبند عرض.
   النافذة تُبنى في DOM مباشرة دون render() حتى لا تضيع القيم المكتوبة. */
function itemPickRowHtml(it){
  return '<div class="item-pick-row" data-item-id="'+esc(it.id)+'"><b>'+esc(it.code)+'</b> — '+esc(it.name)+' <span class="muted">('+(esc(it.unit||"—"))+' — المتاح: '+it.qty+' — سعر البيع: '+fmtM(it.salePrice)+')</span></div>';
}
function bindItemPickRows(container,target){
  if(!container)return;
  container.querySelectorAll(".item-pick-row").forEach(function(row){
    row.addEventListener("click",function(){var it=itemById(row.getAttribute("data-item-id"));pickItem(it,target);});
  });
}
function closeItemPicker(){var m=$("itemPickerModal");if(m)m.remove();}
function closeItemSuggest(){var d=$("itemPickerDrop");if(d)d.remove();}
function openItemPicker(target){
  closeItemPicker();closeItemSuggest();
  var overlay=document.createElement("div");
  overlay.id="itemPickerModal";
  overlay.className="item-modal";
  var rows=state.items.map(function(it){return itemPickRowHtml(it);}).join("");
  overlay.innerHTML='<div class="item-modal-card"><h3>اختر صنفاً</h3>'+
    '<input id="itemPickerSearch" class="inp" placeholder="ابحث بالاسم أو الكود…" oninput="itemPickerSearchInput(this)">'+
    '<div id="itemPickerList" style="max-height:300px;overflow:auto;margin-top:.5rem">'+(rows||'<p class="muted">لا توجد أصناف مسجلة بعد — سجّلها من شاشة الأصناف.</p>')+'</div>'+
    '<div class="row" style="margin-top:.6rem"><button type="button" class="btn btn-ghost" onclick="closeItemPicker()">إغلاق (Esc)</button></div></div>';
  document.body.appendChild(overlay);
  state.ui.itemPickerTarget=target;
  bindItemPickRows(overlay,target);
  var s=$("itemPickerSearch");if(s)try{s.focus();}catch(e){}
}
function itemPickerSearchInput(el){
  var list=$("itemPickerList");if(!list)return;
  var rows=searchItems(el.value).map(function(it){return itemPickRowHtml(it);}).join("");
  list.innerHTML=rows||'<p class="muted">لا توجد أصناف مطابقة.</p>';
  bindItemPickRows(list,state.ui.itemPickerTarget);
}
function pickItem(it,target){
  if(!it)return;
  closeItemPicker();closeItemSuggest();
  if(target&&target.kind==="quote"){
    var ls=qLines();var l=ls[target.line];if(!l)return;
    l.name=it.name;l.price=it.salePrice;l.unit=it.unit||"";l.itemId=it.id;l.availQty=it.qty;
    render();
  }else if(target&&target.kind==="form"){
    /* اختيار صنف في نموذج الأصناف يفتح وضع تعديله ببياناته كاملة. */
    state.ui.editItemId=it.id;
    render();
  }else if(target&&target.el){
    target.el.value=it.name;
  }
}
function itemPickerKey(e,inputEl,target){
  if(e&&e.key==="F9"){e.preventDefault();openItemPicker(target);return;}
  if(e&&e.key==="Escape"){closeItemPicker();closeItemSuggest();}
}
function itemPickerInput(inputEl,target){
  closeItemSuggest();
  var q=String(inputEl.value||"").trim();
  if(q.length<1)return;
  var matches=searchItems(q).slice(0,8);
  if(!matches.length)return;
  var d=document.createElement("div");
  d.id="itemPickerDrop";d.className="item-suggest";
  d.innerHTML=matches.map(function(it){return itemPickRowHtml(it);}).join("");
  if(inputEl.parentElement)inputEl.parentElement.appendChild(d);else document.body.appendChild(d);
  bindItemPickRows(d,target);
}
/* ---------- عروض الأسعار ---------- */
function qLineRow(i,l){
  var avail=(l.itemId&&l.availQty!==undefined)?'<div class="muted">الوحدة: '+esc(l.unit||"—")+' — المتاح: '+l.availQty+'</div>':(l.unit?'<div class="muted">الوحدة: '+esc(l.unit)+'</div>':"");

  '<td><input class="inp num" type="number" min="0" step="0.01" data-ql="'+i+'" data-qf="qty" value="'+esc(l.qty||"")+'" onchange="qLineChange('+i+',\'qty\',this.value)"></td>'+
  '<td><input class="inp num" type="number" min="0" step="0.01" data-ql="'+i+'" data-qf="price" value="'+esc(l.price||"")+'" onchange="qLineChange('+i+',\'price\',this.value)"></td>'+

function qLines(){if(!state.ui.qLines)state.ui.qLines=[{name:"",qty:1,price:""},{name:"",qty:1,price:""}];return state.ui.qLines;}
function qLineChange(i,f,v){var ls=qLines();if(!ls[i])return;if(f==="name"){ls[i].name=v;ls[i].itemId=null;ls[i].unit="";ls[i].availQty=undefined;}else ls[i][f]=v;render();}
/* حالة عقد الصيانة في نموذج العرض: تُحفظ في state.ui.qMaint فور
   تغييرها، فتبقى بعد كل إعادة رسم (إضافة بند، كتابة اسم صنف...).
   العطل السابق: الزر كان onchange="render()" بلا حفظ — كل إعادة رسم
   كانت تعيد بناء النموذج والزر غير مفعّل وتضيع القيم المكتوبة. */
function qMaintState(){if(!state.ui.qMaint)state.ui.qMaint={included:false,type:CONTRACT_TYPES[0],amount:0,duration:""};return state.ui.qMaint;}
function qMaintToggle(on){var qm=qMaintState();qm.included=!!on;render();}
function qMaintField(f,v){var qm=qMaintState();if(f==="amount")qm.amount=Number(v)||0;else qm[f]=v;}
function qAddLine(){qLines().push({name:"",qty:1,price:""});render();}

function doPrintQuote(qid){var r=printQuotation(qid);if(r.error){alert(r.error);return;}var q=quoteById(qid);logAudit("print_quotation","طباعة عرض السعر "+(q?q.number:""),q?q.number:"","عروض الأسعار");save();}

function doCreateQuote(){
  var pid=$("qProject").value;
  var qm=qMaintState();
  var maint={included:qm.included,type:qm.type,amount:qm.amount,duration:qm.duration};
  var r=createQuotation(pid,qLines(),maint,$("qNumber").value);
  var m=$("qMsg");
  if(r.error){if(m)m.innerHTML='<div class="err">'+esc(r.error)+'</div>';return;}
  state.ui.qLines=[{name:"",qty:1,price:""},{name:"",qty:1,price:""}];
  state.ui.qMaint={included:false,type:CONTRACT_TYPES[0],amount:0,duration:""};
  render();var m2=$("qMsg");if(m2)m2.innerHTML='<div class="okbox">تم حفظ العرض '+esc(r.quotation.number)+' كمسودة — أرسله للعميل من جدول العروض.</div>';

function doSendQuote(qid){var r=sendQuotation(qid);if(r.error){alert(r.error);return;}render();}
function doClientResp(qid,dec){

  var r=clientResponse(qid,dec,note);
  if(r.error){alert(r.error);return;}
  render();
