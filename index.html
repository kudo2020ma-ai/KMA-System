<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>نظام KMA</title>
<style>
:root{--bg:#f4f2ec;--surface:#fff;--alt:#eceae2;--text:#1c2733;--dim:#5d6b7a;--border:#d8d4c8;--accent:#0e7c7b;--navy:#0f2a4a;--gold:#c9a227;--danger:#b3372f;--ok:#1a7a4a;--r:10px}
*{box-sizing:border-box}html{font-family:Tahoma,"Segoe UI",system-ui,sans-serif}body{margin:0;background:var(--bg);color:var(--text)}
button,select,input,textarea{font-family:inherit}button{cursor:pointer;min-height:2.25rem}
.inp{width:100%;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text);padding:.5rem .75rem;font-size:.95rem;outline:none}.inp:focus{border-color:var(--accent)}
.field label{display:block;margin-bottom:.25rem;font-size:.85rem;font-weight:600}
.form-grid{display:grid;grid-template-columns:1fr;gap:.75rem}@media(min-width:640px){.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}}@media(min-width:1024px){.c4{grid-template-columns:repeat(4,1fr)}}
.btn-p{background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:.5rem 1.1rem;font-weight:700}.btn-o{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:var(--r);padding:.3rem .7rem;font-weight:600;font-size:.85rem}.btn-g{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:var(--r);padding:.45rem .9rem;font-weight:600}.btn-d{background:transparent;border:1px solid var(--danger);color:var(--danger);border-radius:var(--r);padding:.3rem .7rem;font-weight:600;font-size:.85rem}.btn-dr{background:var(--danger);color:#fff;border:none;border-radius:var(--r);padding:.3rem .7rem;font-weight:700;font-size:.85rem}.btn-navy{background:var(--navy);color:#fff;border:none;border-radius:var(--r);padding:.45rem .9rem;font-weight:700;font-size:.85rem}
.err{margin-top:.5rem;font-size:.875rem;font-weight:600;color:var(--danger)}.okn{font-weight:600;color:var(--ok);font-size:.875rem}.empty{padding:.75rem 0;text-align:center;font-size:.875rem;color:var(--dim)}.muted{color:var(--dim);font-size:.78rem}.strong{font-weight:700}.black{font-weight:900}.hidden{display:none!important}
.login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;background:radial-gradient(circle at 20% 15%,#1b4066 0,transparent 45%),radial-gradient(circle at 85% 90%,rgba(14,124,123,.35) 0,transparent 40%),var(--navy)}
.login-card{width:100%;max-width:24rem;background:var(--surface);border-radius:16px;padding:1.5rem;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.login-logo{width:4rem;height:4rem;margin:0 auto;display:flex;align-items:center;justify-content:center;background:var(--navy);color:var(--gold);border-radius:12px;font-size:1.25rem;font-weight:900}
.login-card h1{margin:.75rem 0 0;text-align:center;font-size:1.5rem;font-weight:900;color:var(--navy)}.login-sub{margin:.25rem 0 1.25rem;text-align:center;font-size:.875rem;color:var(--dim)}
.pass-wrap{position:relative}.pass-wrap .inp{padding-left:2.9rem}.pass-toggle{position:absolute;left:.35rem;top:50%;transform:translateY(-50%);width:2.4rem;height:2.4rem;min-height:2.4rem;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--dim);padding:0}.pass-toggle:hover{color:var(--navy);background:var(--alt);border-color:var(--border)}.pass-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.pass-toggle svg{width:1.25rem;height:1.25rem;flex-shrink:0}
header.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.topbar-in{max-width:76rem;margin:0 auto;padding:.65rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.75rem;min-width:0}.badge{width:2.5rem;height:2.5rem;display:flex;align-items:center;justify-content:center;background:var(--gold);color:var(--navy);border-radius:8px;font-size:.85rem;font-weight:900;flex-shrink:0}
.brand-name{font-weight:900;line-height:1.2}.brand-sub{font-size:.75rem;color:rgba(255,255,255,.75);display:block}
.top-actions{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}.btn-home{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:var(--r);padding:.5rem .9rem;font-weight:700;font-size:.85rem}.btn-out{background:var(--danger);color:#fff;border:none;border-radius:var(--r);padding:.5rem .9rem;font-weight:700;font-size:.85rem}
main.page{max-width:76rem;margin:0 auto;padding:1.1rem 1rem 2.5rem}.stack>*+*{margin-top:1.1rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1rem;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{margin:0 0 .75rem;padding-bottom:.5rem;border-bottom:2px solid var(--gold);font-size:1.1rem;font-weight:700;color:var(--navy)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}@media(min-width:1024px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.75rem}.stat .lbl{font-size:.75rem;font-weight:600;color:var(--dim);margin:0}.stat .val{margin:.25rem 0 0;font-size:1.1rem;font-weight:900;color:var(--navy)}
.rows{list-style:none;margin:0;padding:0}.rows>li{padding:.5rem 0;font-size:.875rem}.rows.divided>li+li{border-top:1px solid var(--border)}
.row-b{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.tag{display:inline-block;margin-right:.4rem;padding:.1rem .5rem;background:var(--alt);border-radius:6px;font-size:.72rem}.tagk{color:#fff;font-weight:700}.ts{background:var(--accent)}.tp{background:var(--navy)}
.qb{padding:.25rem .5rem;border-radius:6px;font-weight:900;background:var(--alt)}.qb.low{background:var(--danger);color:#fff}.bb{padding:.25rem .5rem;border-radius:6px;font-weight:900;background:var(--alt)}.bb.owed{background:var(--gold);color:var(--navy)}
.dept-grid{display:grid;grid-template-columns:1fr;gap:.75rem}@media(min-width:640px){.dept-grid{grid-template-columns:repeat(2,1fr)}}@media(min-width:1024px){.dept-grid{grid-template-columns:repeat(3,1fr)}}
.dept-btn{display:flex;align-items:center;gap:1rem;text-align:right;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem;color:var(--text)}.dept-btn:hover{border-color:var(--accent)}
.dept-icon{width:3.2rem;height:3.2rem;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--navy);color:var(--gold);border-radius:12px;font-size:1.3rem;font-weight:900}
.dept-title{display:block;font-size:1.05rem;font-weight:900;color:var(--navy)}.dept-sub{display:block;margin-top:.15rem;font-size:.83rem;color:var(--dim)}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap}.tabs button{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:.4rem .9rem;font-weight:700;font-size:.85rem}.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tbl-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{border:1px solid var(--border);padding:.4rem .5rem;text-align:right}th{background:var(--navy);color:#fff}td.num,th.num{text-align:left}
.line-row{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;align-items:end;background:var(--alt);border-radius:var(--r);padding:.5rem;margin-top:.5rem}@media(min-width:1024px){.line-row{grid-template-columns:repeat(5,1fr)}}
.pay-toggle{display:flex;gap:.5rem}.pay-toggle button{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:var(--r);padding:.5rem;font-weight:700}.pay-toggle button.on{border-color:var(--accent);background:var(--accent);color:#fff}
.inv-box{border:1px solid var(--border);border-radius:var(--r);padding:.75rem;font-size:.875rem}.inv-box+.inv-box{margin-top:.75rem}
.inv-lines{list-style:none;margin:.5rem 0 0;padding:.5rem 0 0;border-top:1px solid var(--border);font-size:.78rem;color:var(--dim)}.inv-lines li{display:flex;justify-content:space-between;padding:.15rem 0}
.lowrow{display:flex;align-items:center;justify-content:space-between;background:var(--alt);border-radius:var(--r);padding:.5rem .75rem;font-size:.875rem;margin-top:.5rem}.lowrow .n{font-weight:900;color:var(--danger)}
.pay-form{display:flex;align-items:center;gap:.5rem;margin-top:.5rem;flex-wrap:wrap}.pay-form .inp{max-width:10rem}
.align-end{display:flex;align-items:flex-end;gap:.5rem;flex-wrap:wrap}
.qrbox{display:inline-block;background:#fff;border:1px solid var(--border);padding:6px;line-height:0}
.bar{height:14px;background:var(--alt);border-radius:7px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}
@media print{header.topbar,.noprint{display:none!important}body{background:#fff}main.page{max-width:100%}}
</style>
</head>
<body>
<div id="loginView" class="login-wrap">
<form id="loginForm" class="login-card" autocomplete="off">
<div class="login-logo">KMA</div><h1>نظام KMA</h1><p class="login-sub">نظام إدارة الحسابات والمخزون والمبيعات والمشتريات</p>
<div class="field"><label for="loginUser">اسم المستخدم</label><input id="loginUser" class="inp" type="text" value="" placeholder="اكتب اسم المستخدم" dir="ltr" style="text-align:right" autocomplete="off"></div>
<div class="field" style="margin-top:.75rem"><label for="loginPass">كلمة المرور</label><div class="pass-wrap"><input id="loginPass" class="inp" type="password" value="" placeholder="اكتب كلمة المرور" dir="ltr" style="text-align:right" autocomplete="off"><button type="button" id="togglePass" class="pass-toggle" aria-label="إظهار كلمة المرور" aria-pressed="false" title="إظهار كلمة المرور"><svg id="eyeShow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg><svg id="eyeHide" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.24A9.5 9.5 0 0 1 12 4c6.5 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19M6.61 6.61A13.5 13.5 0 0 0 2 12s3.5 8 10 8a9.7 9.7 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/></svg></button></div></div>
<p id="loginError" class="err" role="alert"></p>
<button type="submit" class="btn-p" style="width:100%;margin-top:1rem;padding:.75rem;font-size:1.1rem">دخول</button>
<p class="muted" style="text-align:center;margin-top:.75rem">Enter في اسم المستخدم ينقلك إلى كلمة المرور، وEnter فيها يدخلك للنظام</p>
</form>
</div>
<div id="appView" class="hidden">
<header class="topbar"><div class="topbar-in">
<div class="brand"><span class="badge">KMA</span><span><span class="brand-name" id="brandCompany">KMA</span><span class="brand-sub" id="brandSection">القائمة الرئيسية</span><span class="brand-sub" id="brandBranch"></span></span></div>
<div class="top-actions"><button type="button" id="btnHome" class="btn-home hidden">القائمة الرئيسية</button><span style="font-size:.85rem;color:rgba(255,255,255,.85)">المستخدم: <span id="userChip"></span></span><button type="button" id="btnLogout" class="btn-out">خروج</button></div>
</div></header>
<main class="page"><div id="viewHome" class="stack"></div><div id="viewDept" class="stack hidden"></div></main>
</div>
<script>
"use strict";
var DBKEY="kma3_db_v2";
function defState(){return{
 user:null,dept:"home",tab:{},
 settings:{companyName:"KMA",taxNo:"",crNo:"",currency:"ر.س",taxRate:15,fiscalYear:"2026",maxDiscount:10,autoPost:true,largeLimit:10000,address:""},
 branches:[{id:1,name:"الفرع الرئيسي",city:"الرياض"}],activeBranchId:1,
 users:[{id:1,username:"1",password:"1",role:"admin",name:"المدير"}],
 accounts:[],journal:[],costCenters:[],funds:[],vouchers:[],assets:[],budgets:[],
 items:[],groups:[],warehouses:[{id:1,name:"المستودع الرئيسي"}],transfers:[],counts:[],
 partners:[],employees:[],invoices:[],orders:[],quotes:[],installments:[],periods:[],audit:[],printCounts:{},
 seq:{user:2,account:1,journal:1,item:1,move:1,partner:1,invoice:1,purchase:1,sale:1,branch:2,cc:1,fund:1,voucher:1,asset:1,group:1,wh:2,transfer:1,count:1,order:1,quote:1,inst:1,emp:1,budget:1},
 moves:[]
};}
var state;
try{var raw=localStorage.getItem(DBKEY);state=raw?JSON.parse(raw):defState();if(!state.settings)state=defState();}catch(e){state=defState();}
state.user=null;state.dept="home";
function save(){try{localStorage.setItem(DBKEY,JSON.stringify(state));}catch(e){}}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function nowT(){var d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function fmtM(m){return (m/100).toLocaleString("ar-u-nu-latn",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtQ(n){return Number(n).toLocaleString("ar-u-nu-latn",{maximumFractionDigits:3});}
function parseM(s){var v=parseFloat(String(s).replace(/,/g,""));return isFinite(v)?Math.round(v*100):NaN;}
function cur(){return state.settings.currency;}
function byId(l,id){for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null;}
function branchName(){var b=byId(state.branches,state.activeBranchId);return b?b.name:"—";}
function logA(action,detail){state.audit.push({id:state.audit.length+1,date:today(),time:nowT(),user:state.user?state.user.username:"—",action:action,detail:detail||""});save();}
function tabOf(dft){return state.tab[state.dept]||dft;}
function setTab(t){state.tab[state.dept]=t;armedDelete=null;render();}
var DEPTS=[
 {key:"dashboard",title:"لوحة التحكم Dashboard",sub:"مؤشرات اتخاذ القرار وفلترة بالفترة"},
 {key:"system",title:"إدارة النظام",sub:"المستخدمون والفروع والتهيئة والنسخ الاحتياطي"},
 {key:"accounts",title:"إدارة الحسابات",sub:"دليل الحسابات والقيود والسندات والتقارير المالية"},
 {key:"inventory",title:"المخزون والجرد",sub:"الأصناف والمستودعات والتحويل والجرد والتقييم"},
 {key:"purchases",title:"المشتريات والموردون",sub:"أوامر الشراء والعروض والفواتير والمرتجعات"},
 {key:"sales",title:"المبيعات والعملاء",sub:"الفواتير والمرتجعات والأقساط ونقاط البيع"},
 {key:"reports",title:"التقارير الرقابية واليومية",sub:"سجل الرقابة واليومية العامة"}
];
var TITLES={};DEPTS.forEach(function(d){TITLES[d.key]=d.title;TITLES.home="القائمة الرئيسية";});
var ATYPES={asset:"أصول",liability:"خصوم",equity:"حقوق ملكية",income:"إيرادات",expense:"مصروفات"};
function totals(f){var t={sales:0,purchases:0,salesCount:0,purchasesCount:0,stockCost:0,stockSale:0,profit:0,accBal:0,custOwed:0,suppOwed:0,debit:0,credit:0,retS:0,retP:0};
 state.invoices.forEach(function(v){if(f&&(v.date<f.from||v.date>f.to))return;
  if(v.kind==="sale"){t.sales+=v.total;t.salesCount++;v.lines.forEach(function(l){var it=byId(state.items,l.itemId);t.profit+=l.total-Math.round(l.qty*(it?it.avgCost||it.costPrice:0));});}
  else if(v.kind==="purchase"){t.purchases+=v.total;t.purchasesCount++;}
  else if(v.kind==="saleReturn"){t.retS+=v.total;}else if(v.kind==="purchaseReturn"){t.retP+=v.total;}});
 state.items.forEach(function(i){t.stockCost+=Math.round(i.qty*(i.avgCost||i.costPrice));t.stockSale+=Math.round(i.qty*i.salePrice);});
 state.accounts.forEach(function(a){t.accBal+=a.balance;});state.funds.forEach(function(x){t.accBal+=x.balance;});
 state.partners.forEach(function(p){if(p.kind==="customer")t.custOwed+=p.balance;else t.suppOwed+=p.balance;});
 state.journal.forEach(function(e){if(e.status==="posted"){t.debit+=e.debit;t.credit+=e.credit;}});return t;}
function statCard(l,v,c){return '<div class="stat"><p class="lbl">'+esc(l)+'</p><p class="val">'+esc(v)+(c?'<span style="font-size:.72rem;color:var(--dim)"> '+esc(cur())+"</span>":"")+"</p></div>";}
function card(t,inner){return '<section class="card"><h2>'+esc(t)+"</h2>"+inner+"</section>";}
function emptyN(t){return '<p class="empty">'+esc(t)+"</p>";}
var armedDelete=null;
function dBtn(a,id){var k=a+":"+id;if(armedDelete===k)return '<button type="button" class="btn-dr" data-act="'+a+'" data-id="'+id+'">تأكيد الحذف</button>';return '<button type="button" class="btn-d" data-arm="'+k+'">حذف</button>';}
function tabsHtml(list,curT){return '<div class="tabs noprint">'+list.map(function(x){return '<button type="button" data-tab="'+x[0]+'" class="'+(curT===x[0]?"on":"")+'">'+esc(x[1])+"</button>";}).join("")+"</div>";}
function go(d){state.dept=d;armedDelete=null;render();window.scrollTo(0,0);}
function render(){$("brandCompany").textContent=state.settings.companyName||"KMA";$("brandSection").textContent=state.dept==="home"?"القائمة الرئيسية":TITLES[state.dept];$("brandBranch").textContent="الفرع النشط: "+branchName()+" — السنة المالية "+state.settings.fiscalYear;$("btnHome").classList.toggle("hidden",state.dept==="home");
 if(state.dept==="home"){$("viewHome").classList.remove("hidden");$("viewDept").classList.add("hidden");renderHome();}
 else{$("viewHome").classList.add("hidden");$("viewDept").classList.remove("hidden");var v=$("viewDept");
  if(state.dept==="dashboard")renderDashboard(v);else if(state.dept==="system")renderSystem(v);else if(state.dept==="accounts")renderAccounts(v);
  else if(state.dept==="inventory")renderInventory(v);else if(state.dept==="purchases")renderTradeDept(v,"purchase");else if(state.dept==="sales")renderTradeDept(v,"sale");else if(state.dept==="reports")renderControl(v);}}
function renderHome(){var t=totals();var h='<div class="stat-grid">'+statCard("قيمة المخزون (متوسط مرجح)",fmtM(t.stockCost),1)+statCard("إجمالي المبيعات",fmtM(t.sales),1)+statCard("صافي المشتريات",fmtM(t.purchases-t.retP),1)+statCard("الربح التقديري",fmtM(t.profit),1)+"</div>";
 h+='<div class="dept-grid">'+DEPTS.map(function(d){return '<button type="button" class="dept-btn" data-go="'+d.key+'"><span class="dept-icon">K</span><span><span class="dept-title">'+esc(d.title)+'</span><span class="dept-sub">'+esc(d.sub)+"</span></span></button>";}).join("")+"</div>";
 var low=state.items.filter(function(i){return i.qty<=i.minQty;});
 if(low.length)h+=card("تنبيه: أصناف وصلت للحد الأدنى",low.map(function(i){return '<div class="lowrow"><span class="strong">'+esc(i.name)+'</span><span class="n">المتبقي '+fmtQ(i.qty)+" "+esc(i.unit)+"</span></div>";}).join(""));
 var rec=state.invoices.slice(-8).reverse();
 h+=card("أحدث الفواتير",rec.length?'<ul class="rows divided">'+rec.map(function(v){return '<li class="row-b"><span><span class="tag tagk '+(v.kind.indexOf("sale")===0?"ts":"tp")+'">'+(v.kind==="sale"?"بيع":v.kind==="purchase"?"شراء":v.kind==="saleReturn"?"مرتجع بيع":"مرتجع شراء")+'</span><span class="strong">فاتورة '+v.number+"</span>"+(v.partnerName?' <span style="color:var(--dim)">— '+esc(v.partnerName)+"</span>":"")+'</span><span><span class="black">'+fmtM(v.total)+" "+esc(cur())+'</span> <span class="muted">'+esc(v.date)+"</span></span></li>";}).join("")+"</ul>":emptyN("لا توجد فواتير بعد — ابدأ من المشتريات أو المبيعات"));
 $("viewHome").innerHTML=h;}
var dashF={from:"",to:""};
function renderDashboard(v){var f=(dashF.from&&dashF.to)?{from:dashF.from,to:dashF.to}:null;var t=totals(f);
 var topItems={};state.invoices.forEach(function(x){if(x.kind==="sale")x.lines.forEach(function(l){topItems[l.itemName]=(topItems[l.itemName]||0)+l.total;});});
 var topArr=Object.keys(topItems).map(function(k){return[k,topItems[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,5);var mx=topArr.length?topArr[0][1]:1;
 var overdue=state.installments.filter(function(i){return !i.paid&&i.dueDate<today();});
